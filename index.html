const STARTER_RULES = [
  [/zepto|bigbasket|blinkit|grofers|dmart|d mart|jiomart|instamart|reliance fresh|reliance smart|more retail|milk|dairy|amul|kirana|provision|vegetable|sabzi|bakery|supermarket|swiggy|zomato|restaurant|\bcafe\b|dominos|pizza|mcdonald|\bkfc\b|burger|starbucks|biryani|hotel/, /food|grocer|dining/],
  [/\buber\b|\bola\b|rapido|irctc|redbus|metro|railway|petrol|fuel|hpcl|bpcl|iocl|indian oil|fastag|\btoll|parking|makemytrip|indigo|air india|\bcab\b/, /travel|transport|vehicle|fuel/],
  [/electricity|msedcl|adani elec|tata power|mahanagar gas|\bmgl\b|\bgas\b|broadband|airtel|\bjio\b|vodafone|recharge|bsnl|water bill|\bdth\b|tata play|fibernet/, /utilit|bill|electric|phone|recharge/],
  [/amazon|flipkart|myntra|ajio|meesho|nykaa|lifestyle|pantaloons|westside|max fashion|decathlon|croma|vijay sales/, /shop|cloth|fashion/],
  [/pharm|apollo|medplus|netmeds|1mg|hospital|clinic|diagnostic|dental|doctor|medical/, /health|medic/],
  [/netflix|hotstar|prime video|spotify|bookmyshow|\bpvr\b|\binox\b|youtube|sony liv|zee5|gaming/, /entertain|movie|fun/],
  [/school|college|tuition|\bfees?\b|byju|unacademy|udemy|coaching|exam|stationery|\bbooks?\b/, /educat|school|study/],
  [/\brent\b|maintenance|society|housing|property tax|plumber|electrician|repair/, /rent|hous|home/],
];
const MON = { jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };

function parseCSV(text) {
  const sample = text.slice(0, 3000);
  const delim = [",", "\t", ";"].sort((a, b) => sample.split(b).length - sample.split(a).length)[0];
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(cell); cell = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += c;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.map((r) => r.map((x) => x.trim())).filter((r) => r.some((x) => x));
}

function parseStmtDate(v) {
  const m = String(v || "").trim().match(/^(\d{1,4})[\/\-. ]([A-Za-z]{3,9}|\d{1,2})[\/\-. ](\d{2,4})/);
  if (!m) return null;
  let d, mo, y;
  if (m[1].length === 4) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else { d = +m[1]; mo = isNaN(+m[2]) ? MON[m[2].slice(0, 3).toLowerCase()] : +m[2]; y = +m[3]; if (y < 100) y += 2000; }
  if (!mo || mo > 12 || d < 1 || d > 31) return null;
  return y + "-" + String(mo).padStart(2, "0") + "-" + String(d).padStart(2, "0");
}

const stmtNum = (v) => { const n = parseFloat(String(v || "").replace(/[₹,\sA-Za-z]/g, "")); return isNaN(n) ? 0 : Math.abs(n); };

// Strip UPI/bank noise so the merchant name is what's left.
function cleanDesc(d) {
  return String(d || "")
    .replace(/\b(UPI|IMPS|NEFT|RTGS|POS|ATM|ACH|ECS|NACH|BIL|TPT|MB|IB|DR|CR|okaxis|okhdfcbank|oksbi|okicici|ybl|ibl|axl|apl)\b/gi, " ")
    .replace(/\b[A-Z]{4}0[A-Z0-9]{6}\b/g, " ")
    .replace(/\b\d*x{2,}\d*\b/gi, " ")
    .replace(/\b\d{5,}\b/g, " ")
    .replace(/[@\/\-_:*]+/g, " ")
    .replace(/\s+/g, " ").trim();
}

function readStatement(text) {
  const rows = parseCSV(text);
  const hi = rows.findIndex((r) => r.some((c) => /date/i.test(c)) && r.some((c) => /narration|description|particulars|details|remarks/i.test(c)) && r.some((c) => /withdraw|debit|amount|^dr$/i.test(c)));
  if (hi < 0) return { error: "I couldn't find the date, description and amount columns. Please upload the CSV statement from your bank." };
  const h = rows[hi].map((c) => c.toLowerCase());
  const iType = h.findIndex((c) => /dr\/cr|cr\/dr|debit\/credit|^type$|txn type/.test(c));
  const iDr = h.findIndex((c, i) => i !== iType && /withdraw|debit|^dr$/.test(c));
  const iCr = h.findIndex((c, i) => i !== iType && /deposit|credit|^cr$/.test(c));
  const iAmt = h.findIndex((c, i) => i !== iType && i !== iDr && i !== iCr && /amount/.test(c));
  let iDate = h.findIndex((c) => /date/.test(c) && !/value/.test(c));
  if (iDate < 0) iDate = h.findIndex((c) => /date/.test(c));
  const iDesc = h.findIndex((c) => /narration|description|particulars|details|remarks/.test(c));
  const body = rows.slice(hi + 1);
  const anyNeg = iAmt >= 0 && body.some((r) => /^-|\(/.test(String(r[iAmt] || "")));
  const out = []; let credits = 0;
  for (const r of body) {
    const date = parseStmtDate(r[iDate]);
    if (!date) continue;
    let debit = 0, credit = 0;
    if (iDr >= 0 || iCr >= 0) { debit = iDr >= 0 ? stmtNum(r[iDr]) : 0; credit = iCr >= 0 ? stmtNum(r[iCr]) : 0; }
    else if (iAmt >= 0) {
      const raw = String(r[iAmt] || ""), a = stmtNum(raw);
      const isCr = iType >= 0 ? /^c/i.test(r[iType] || "") : /cr/i.test(raw) || (anyNeg && !/^-|\(/.test(raw));
      if (isCr) credit = a; else debit = a;
    }
    if (debit > 0) {
      const desc = r[iDesc] || "", clean = cleanDesc(desc);
      out.push({ date, desc, clean, key: clean.toLowerCase().split(" ").slice(0, 2).join(" "), amount: debit });
    } else if (credit > 0) credits++;
  }
  if (!out.length) return { error: "No expense rows found in that file." };
  return { rows: out, credits };
}

function guessCategory(clean, cats, rules) {
  const d = clean.toLowerCase();
  for (const k of Object.keys(rules).sort((a, b) => b.length - a.length)) if (d.includes(k) && cats.some((c) => c.id === rules[k])) return rules[k];
  for (const c of cats) {
    const w = c.name.toLowerCase().split(/[^a-z0-9]+/).filter((x) => x.length >= 4 && x !== "other");
    if (w.some((x) => new RegExp("\\b" + x + "\\b").test(d))) return c.id;
  }
  for (const [kw, hint] of STARTER_RULES) if (kw.test(d)) { const c = cats.find((c) => hint.test(c.name.toLowerCase())); if (c) return c.id; }
  return null;
}

function ImportStatementModal({ data, defaultMemberId, onClose, onImport, onAddCategory }) {
  const cats = data.categories.filter((c) => !c.isSystem);
  const otherId = (cats.find((c) => c.id === "other") || cats.find((c) => /^other/i.test(c.name)) || cats[cats.length - 1])?.id;
  const catName = (id) => cats.find((c) => c.id === id)?.name || "Other";
  const [memberId, setMemberId] = useState(defaultMemberId || data.members[0]?.id);
  const [rows, setRows] = useState(null);
  const [credits, setCredits] = useState(0);
  const [err, setErr] = useState("");
  const [newCatFor, setNewCatFor] = useState(null); // { i, j } j = -1 main category, else split index

  async function onFile(e) {
    const file = e.target.files?.[0];
    if (!file) return;
    setErr("");
    if (/\.xlsx?$/i.test(file.name)) { setErr("Excel files can't be read yet. In Excel use Save As → CSV, then upload that file."); return; }
    try {
      const res = readStatement(await file.text());
      if (res.error) { setErr(res.error); return; }
      const seen = new Set(data.transactions.filter((t) => t.type === "expense").map((t) => t.date + "|" + t.amount));
      setCredits(res.credits);
      setRows(res.rows.map((r, i) => {
        const dup = seen.has(r.date + "|" + r.amount);
        return { ...r, i, key: r.key || "row" + i, catId: guessCategory(r.clean, cats, data.merchantRules || {}) || otherId, splits: [], dup, on: !dup };
      }));
    } catch (x) { setErr("Couldn't read that file. Please upload a CSV."); }
  }

  const upd = (i, patch) => setRows((rs) => rs.map((x) => (x.i === i ? { ...x, ...patch } : x)));
  const setPartCat = (r, j, v) => {
    if (v === "__new") { setNewCatFor({ i: r.i, j }); return; }
    if (j < 0) upd(r.i, { catId: v }); else upd(r.i, { splits: r.splits.map((sp, k) => (k === j ? { ...sp, catId: v } : sp)) });
  };
  const setPartAmt = (r, j, v) => upd(r.i, { splits: r.splits.map((sp, k) => (k === j ? { ...sp, amount: v } : sp)) });
  const addPart = (r) => upd(r.i, { splits: [...r.splits, { catId: cats.find((c) => c.id !== r.catId)?.id || otherId, amount: "" }] });
  const delPart = (r, j) => upd(r.i, { splits: r.splits.filter((_, k) => k !== j) });
  const remaining = (r) => Math.round((r.amount - r.splits.reduce((t, sp) => t + (Number(sp.amount) || 0), 0)) * 100) / 100;
  function saveNewCat(vals) {
    const c = onAddCategory(vals);
    const r = rows.find((x) => x.i === newCatFor.i);
    if (r) setPartCat(r, newCatFor.j, c.id);
    setNewCatFor(null);
  }

  const chosen = rows ? rows.filter((r) => r.on) : [];
  const total = chosen.reduce((t, r) => t + r.amount, 0);
  const otherCount = chosen.filter((r) => r.catId === otherId).length;
  const hasError = chosen.some((r) => remaining(r) < 0);

  function doImport() {
    const rules = {}, byKey = {};
    chosen.filter((r) => !r.splits.length).forEach((r) => { (byKey[r.key] = byKey[r.key] || new Set()).add(r.catId); });
    Object.entries(byKey).forEach(([k, set]) => { const c = [...set][0]; if (set.size === 1 && c !== otherId && k.length >= 3 && !k.startsWith("row")) rules[k] = c; });
    const txs = [];
    chosen.forEach((r) => {
      const base = (r.clean || r.desc).slice(0, 50);
      const parts = r.splits.filter((sp) => Number(sp.amount) > 0).map((sp) => ({ catId: sp.catId, amount: Number(sp.amount) }));
      const rem = remaining(r);
      if (rem > 0) parts.unshift({ catId: r.catId, amount: rem });
      parts.forEach((pt) => txs.push({
        type: "expense", amount: pt.amount, memberId, categoryId: pt.catId, date: r.date,
        note: parts.length > 1 ? base + " · " + catName(pt.catId) : base,
        paidFrom: [{ memberId, amount: pt.amount }], recurringId: null, debtId: null,
      }));
    });
    onImport(txs, rules);
  }

  const catOptions = (<>
    {cats.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
    <option value="__new">+ New category…</option>
  </>);

  return (
    <Modal title="Import bank statement" onClose={onClose} wide>
      {!rows ? (
        <div>
          <p className="text-sm text-stone-600 mb-3">Upload your bank or UPI statement as a <b>CSV</b> file. Each expense is put in the matching category; anything not understood goes to <b>Other</b>. You can change any category or <b>split</b> an expense before importing.</p>
          <Field label="Whose expenses are these?">
            <select className={inputCls} value={memberId} onChange={(e) => setMemberId(e.target.value)}>
              {data.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          </Field>
          <input type="file" accept=".csv,.tsv,.txt,text/csv" onChange={onFile} className="block w-full text-sm text-stone-600 file:mr-3 file:rounded-lg file:border-0 file:bg-indigo-950 file:text-amber-50 file:px-4 file:py-2.5 file:font-semibold" />
          {err && <div className="mt-3 text-sm text-rose-700 bg-rose-50 rounded-lg p-3">{err}</div>}
        </div>
      ) : (
        <div>
          <div className="text-xs text-stone-500 mb-2">{rows.length} expenses found{credits ? ` · ${credits} credits skipped` : ""}{rows.some((r) => r.dup) ? " · possible duplicates are unticked" : ""}. Changing a category changes only that expense.</div>
          <div className="max-h-[50vh] overflow-y-auto border border-stone-200 rounded-xl bg-white divide-y divide-stone-100">
            {rows.map((r) => (
              <div key={r.i} className={"p-2.5 flex gap-2 items-start " + (r.on ? "" : "opacity-50")}>
                <input type="checkbox" className="mt-1" checked={r.on} onChange={() => upd(r.i, { on: !r.on })} />
                <div className="flex-1 min-w-0">
                  <div className="flex justify-between gap-2 text-sm">
                    <span className="truncate font-medium text-stone-800">{r.clean || r.desc}</span>
                    <span className="font-semibold shrink-0">₹{r.amount.toLocaleString("en-IN")}</span>
                  </div>
                  <div className="flex items-center gap-2 mt-1">
                    <span className="text-[11px] text-stone-500 shrink-0">{r.date}{r.dup ? " · maybe added" : ""}</span>
                    <select value={r.catId} onChange={(e) => setPartCat(r, -1, e.target.value)}
                      className={"flex-1 min-w-0 text-xs rounded-md border px-1.5 py-1 bg-white " + (r.catId === otherId ? "border-amber-400 text-amber-800" : "border-stone-300")}>
                      {catOptions}
                    </select>
                  </div>
                  {r.splits.map((sp, j) => (
                    <div key={j} className="flex items-center gap-1.5 mt-1.5 pl-3 border-l-2 border-amber-300">
                      <select value={sp.catId} onChange={(e) => setPartCat(r, j, e.target.value)} className="flex-1 min-w-0 text-xs rounded-md border border-stone-300 px-1.5 py-1 bg-white">{catOptions}</select>
                      <input type="number" step="any" inputMode="decimal" placeholder="₹" value={sp.amount} onChange={(e) => setPartAmt(r, j, e.target.value)} className="w-20 text-xs rounded-md border border-stone-300 px-1.5 py-1" />
                      <button type="button" onClick={() => delPart(r, j)} className="text-stone-400 px-1">✕</button>
                    </div>
                  ))}
                  {r.splits.length > 0 && (
                    <div className={"text-[11px] mt-1 pl-3 " + (remaining(r) < 0 ? "text-rose-700 font-semibold" : "text-stone-500")}>
                      {remaining(r) < 0 ? "Split amounts are more than ₹" + r.amount : "Remaining ₹" + remaining(r).toLocaleString("en-IN") + " stays in " + catName(r.catId)}
                    </div>
                  )}
                  <button type="button" onClick={() => addPart(r)} className="text-[11px] text-indigo-700 underline mt-1">
                    {r.splits.length ? "+ Split more" : "Split this expense"}
                  </button>
                </div>
              </div>
            ))}
          </div>
          {otherCount > 0 && <div className="text-xs text-amber-800 mt-2">{otherCount} selected rows are in "Other". Change them above if you like.</div>}
          <button disabled={!chosen.length || hasError} onClick={doImport} className="w-full mt-3 bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40">
            Import {chosen.length} expenses · ₹{total.toLocaleString("en-IN")}
          </button>
        </div>
      )}
      {newCatFor && (
        <Modal title="New category" onClose={() => setNewCatFor(null)}>
          <NewCategoryForm existingCount={data.categories.length} onSave={saveNewCat} compact />
        </Modal>
      )}
    </Modal>
  );
}

/* ---------------------------------- Debts ---------------------------------- */

// Settlement helpers shared across debt views.
function debtPaidFrom(debtId, transactions) {
  return transactions.filter((t) => t.debtId === debtId).reduce((s, t) => s + t.amount, 0);
}
function isDebtSettled(d, transactions) {
  if (d.internal) return !!d.settled;
  return d.totalAmount > 0 && debtPaidFrom(d.id, transactions) >= d.totalAmount;
}
function debtSettledDate(d, transactions) {
  if (d.internal) return d.settledDate || "";
  const dates = transactions.filter((t) => t.debtId === d.id).map((t) => t.date).sort();
  return dates.length ? dates[dates.length - 1] : "";
}
const fmtStamp = (iso) =>
  iso ? new Date(iso).toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit", hour12: true }) : "";
const shortDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";

function DebtsTab({ data, viewMode, selectedMember, paidOnDebt, onAdd, onPay, onDelete, onSettle, onReopen }) {
  const [showSettled, setShowSettled] = useState(true);
  const txs = data.transactions;
  const settled = (d) => isDebtSettled(d, txs);
  const isPersonView = viewMode !== "family" && !!selectedMember;

  // Scope to the selected person's own debts/IOUs — same rule as PersonDashboard's "My debts" card:
  // external debts assigned to them, or internal family loans where they're the lender/borrower.
  const belongsToPerson = (d) =>
    !isPersonView ||
    (!d.internal && d.memberId === selectedMember.id) ||
    (d.internal && (d.fromMember === selectedMember.id || d.toMember === selectedMember.id));

  const allDebts = data.debts.filter(belongsToPerson);
  // A family IOU is stored once (borrower -> lender). In a person's view it is "to receive" for the
  // lender and "to pay" for the borrower.
  const roleOf = (d) => (d.internal && isPersonView ? (d.toMember === selectedMember.id ? "owed_to_me" : "i_owe") : d.direction);
  const owedActive = allDebts.filter((d) => roleOf(d) === "owed_to_me" && !settled(d));
  const oweActive = allDebts.filter((d) => roleOf(d) === "i_owe" && !settled(d));
  const completed = allDebts
    .filter((d) => settled(d))
    .sort((a, b) => debtSettledDate(b, txs).localeCompare(debtSettledDate(a, txs)));

  return (
    <div className="space-y-5">
      <button onClick={onAdd} className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm flex items-center justify-center gap-1.5">
        <Plus size={15} /> Add a debt
      </button>

      <DebtGroup title={isPersonView ? `Money ${selectedMember.name} will receive` : "Money to receive"} tone="emerald" debts={owedActive} paidOnDebt={paidOnDebt} onPay={onPay} onDelete={onDelete} onSettle={onSettle} members={data.members} />
      <DebtGroup title={isPersonView ? `Money ${selectedMember.name} needs to pay` : "Money to pay"} tone="rose" debts={oweActive} paidOnDebt={paidOnDebt} onPay={onPay} onDelete={onDelete} onSettle={onSettle} members={data.members} />

      {completed.length > 0 && (
        <div>
          <button
            type="button"
            onClick={() => setShowSettled((s) => !s)}
            className="w-full flex items-center justify-between mb-2 group"
          >
            <h3 className="text-[15px] font-semibold tracking-tight text-stone-600">Settled &amp; completed ({completed.length})</h3>
            <ChevronDown size={18} className={`text-stone-400 transition-transform ${showSettled ? "rotate-180" : ""}`} />
          </button>
          {showSettled && (
            <div className="space-y-2.5">
              {completed.map((d) => (
                <SettledDebtCard
                  key={d.id}
                  debt={d}
                  paid={paidOnDebt(d.id)}
                  settledOn={debtSettledDate(d, txs)}
                  onDelete={onDelete}
                  onReopen={onReopen}
                />
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DebtGroup({ title, tone, debts, paidOnDebt, onPay, onDelete, onSettle, members = [] }) {
  const color = tone === "emerald" ? "text-emerald-700" : "text-rose-700";
  const memberName = (id) => members.find((m) => m.id === id)?.name;
  return (
    <div>
      <h3 className={`text-[15px] font-semibold tracking-tight mb-2.5 ${color}`}>{title}</h3>
      <div className="space-y-2.5">
        {debts.map((d) => {
          const paid = paidOnDebt(d.id);
          const remaining = d.totalAmount - paid;
          const pct = (paid / d.totalAmount) * 100;
          return (
            <Card key={d.id} className="p-4">
              <div className="flex items-start justify-between gap-2 mb-1.5">
                <div>
                  <div className="text-[15px] font-semibold text-stone-800 flex items-center gap-1.5">
                    {d.personName}
                    {d.internal && (
                      <span className="text-[10px] font-semibold uppercase tracking-wide bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full">family</span>
                    )}
                  </div>
                  {d.memberId && memberName(d.memberId) && (
                    <div className="text-xs text-stone-500">
                      {tone === "emerald" ? "Lent by" : "Payable by"} {memberName(d.memberId)}
                    </div>
                  )}
                  {d.internal && (
                    <div className="text-xs text-stone-500">{memberName(d.fromMember) || "?"} owes {memberName(d.toMember) || "?"}</div>
                  )}
                  {d.note && <div className="text-xs text-stone-500">{d.note}</div>}
                  {d.dueDate && <div className="text-xs text-stone-500">Due {shortDate(d.dueDate)}</div>}
                </div>
                <button onClick={() => onDelete(d.id)} className="text-stone-300 hover:text-rose-600 p-1"><Trash2 size={14} /></button>
              </div>
              {d.internal ? (
                <div className="flex items-center justify-between mt-1">
                  <span className="text-sm font-mono font-semibold text-stone-700 tabular-nums">{fmt(d.totalAmount)}</span>
                  <button onClick={() => onSettle(d.id)} className="text-xs font-semibold bg-emerald-600 text-white px-3 py-1 rounded-full flex items-center gap-1">
                    <Check size={13} /> Mark repaid
                  </button>
                </div>
              ) : (
                <>
                  <ProgressBar pct={pct} tone={remaining <= 0 ? "ok" : "warn"} />
                  <div className="flex items-center justify-between mt-1.5">
                    <span className="text-xs text-stone-500">{fmt(paid)} of {fmt(d.totalAmount)} {tone === "emerald" ? "received" : "paid"}</span>
                    <button onClick={() => onPay(d)} className="text-xs font-semibold bg-amber-400 text-indigo-950 px-3 py-1 rounded-full">
                      Record payment
                    </button>
                  </div>
                </>
              )}
            </Card>
          );
        })}
        {debts.length === 0 && <p className="text-sm text-stone-500 py-2">{tone === "emerald" ? "No pending amounts to receive." : "No pending payments."}</p>}
      </div>
    </div>
  );
}

function SettledDebtCard({ debt: d, paid, settledOn, onDelete, onReopen }) {
  const toneText = d.direction === "owed_to_me" ? "text-emerald-700" : "text-rose-700";
  return (
    <Card className="p-4 bg-stone-50/70">
      <div className="flex items-start justify-between gap-2">
        <div className="min-w-0">
          <div className="text-sm font-semibold flex items-center gap-1.5 text-stone-600">
            <span className="truncate">{d.personName}</span>
            {d.internal && (
              <span className="text-[10px] font-semibold uppercase tracking-wide bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-full">family</span>
            )}
            <span className="text-[9px] uppercase tracking-wide bg-emerald-100 text-emerald-700 px-1.5 py-0.5 rounded-full flex items-center gap-0.5">
              <Check size={9} /> settled
            </span>
          </div>
          {d.note && <div className="text-xs text-stone-500 truncate">{d.note}</div>}
          <div className="text-xs text-stone-500 mt-0.5">
            <span className={toneText}>{d.internal ? "Repaid in full" : d.direction === "owed_to_me" ? "Received in full" : "Paid in full"}</span>
            {" · "}{fmt(d.totalAmount)}
            {settledOn ? ` · Cleared ${shortDate(settledOn)}` : ""}
          </div>
        </div>
        <div className="flex items-center gap-1 shrink-0">
          <button onClick={() => onReopen(d.id)} title="Reopen" className="text-stone-300 hover:text-amber-600 p-1"><RefreshCw size={13} /></button>
          <button onClick={() => onDelete(d.id)} title="Delete from history" className="text-stone-300 hover:text-rose-600 p-1"><Trash2 size={13} /></button>
        </div>
      </div>
    </Card>
  );
}

function AddDebtModal({ onClose, onSave, members = [] }) {
  const [kind, setKind] = useState(members.length >= 2 ? "family" : "outside");
  const [fromId, setFromId] = useState(members[1]?.id || "");
  const [toId, setToId] = useState(members[0]?.id || "");
  const [personName, setPersonName] = useState("");
  const [direction, setDirection] = useState("owed_to_me");
  const [totalAmount, setTotalAmount] = useState("");
  const [dueDate, setDueDate] = useState("");
  const [note, setNote] = useState("");
  const [memberId, setMemberId] = useState("");
  const [showMore, setShowMore] = useState(false);
  const lbl = "block text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wide";
  const family = kind === "family";
  const receive = family || direction === "owed_to_me";
  const nameOf = (id) => members.find((m) => m.id === id)?.name || "?";
  const chips = (list, value, onPick) => (
    <div className="flex flex-wrap gap-2">
      {list.map((m) => {
        const sel = value === m.id;
        return (
          <button key={m.id || "all"} type="button" onClick={() => onPick(m.id)}
            className={`px-3.5 py-1.5 rounded-full border text-sm font-medium transition ${sel ? "bg-indigo-950 text-amber-50 border-indigo-950" : "bg-white text-stone-600 border-stone-300"}`}>
            {m.name}
          </button>
        );
      })}
    </div>
  );
  const sameFamily = family && fromId === toId;
  const canSave = !!totalAmount && (family ? !!fromId && !!toId && !sameFamily : !!personName);

  const save = () => {
    const amountNum = Number(totalAmount);
    if (family) {
      onSave({ personName: `${nameOf(fromId)} → ${nameOf(toId)}`, direction: "owed_to_me", internal: true, fromMember: fromId, toMember: toId, totalAmount: amountNum, dueDate, note });
    } else {
      onSave({ personName, direction, totalAmount: amountNum, dueDate, note, memberId: memberId || null });
    }
  };

  return (
    <Modal title="Add a debt" onClose={onClose}>
      {members.length >= 2 && (
        <div className="grid grid-cols-2 gap-2 mb-4">
          {[["family", "Within family"], ["outside", "Outside person"]].map(([k, label]) => (
            <button key={k} type="button" onClick={() => setKind(k)}
              className={`rounded-xl border-2 py-2.5 text-sm font-semibold transition-colors ${kind === k ? "border-indigo-950 bg-indigo-50 text-indigo-950" : "border-stone-200 bg-white text-stone-500"}`}>
              {label}
            </button>
          ))}
        </div>
      )}

      {family ? (
        <>
          <div className="mb-4">
            <div className={lbl}>Who owes the money?</div>
            {chips(members, fromId, setFromId)}
          </div>
          <div className="mb-4">
            <div className={lbl}>Who will receive it?</div>
            {chips(members, toId, setToId)}
          </div>
        </>
      ) : (
        <>
          <div className="grid grid-cols-2 gap-2 mb-4">
            <button type="button" onClick={() => setDirection("owed_to_me")}
              className={`rounded-xl border-2 py-3 text-sm font-semibold transition-colors ${direction === "owed_to_me" ? "border-emerald-600 bg-emerald-50 text-emerald-700" : "border-stone-200 bg-white text-stone-500"}`}>
              Money to receive
            </button>
            <button type="button" onClick={() => setDirection("i_owe")}
              className={`rounded-xl border-2 py-3 text-sm font-semibold transition-colors ${direction === "i_owe" ? "border-rose-600 bg-rose-50 text-rose-700" : "border-stone-200 bg-white text-stone-500"}`}>
              Money to pay
            </button>
          </div>
          <Field label={receive ? "Who will pay?" : "Who do you need to pay?"}>
            <input className={inputCls} list="debt-person-suggestions" value={personName} onChange={(e) => setPersonName(e.target.value)} placeholder="Name" />
            <datalist id="debt-person-suggestions">{members.map((m) => <option key={m.id} value={m.name} />)}</datalist>
          </Field>
          <div className="mb-4">
            <div className={lbl}>For</div>
            {chips([{ id: "", name: "Whole family" }, ...members], memberId, setMemberId)}
          </div>
        </>
      )}

      <div className={`rounded-2xl p-4 mb-3 text-center ${receive ? "bg-emerald-50" : "bg-rose-50"}`}>
        <div className="flex items-center justify-center gap-1">
          <span className="text-3xl font-mono text-stone-400">₹</span>
          <input type="number" step="any" inputMode="decimal" autoFocus={!family} value={totalAmount} onChange={(e) => setTotalAmount(e.target.value)} placeholder="0"
            className="w-44 text-4xl font-mono font-semibold text-center bg-transparent outline-none text-stone-800 placeholder:text-stone-300" />
        </div>
      </div>
      {family && (
        <p className={`text-sm mb-3 text-center ${sameFamily ? "text-rose-600" : "text-stone-600"}`}>
          {sameFamily ? "Choose two different people." : `${nameOf(fromId)} will pay ${nameOf(toId)}${totalAmount ? " " + fmt(Number(totalAmount)) : ""}`}
        </p>
      )}

      <button type="button" onClick={() => setShowMore((v) => !v)} className="text-sm font-semibold text-indigo-950 mb-3">
        {showMore ? "− Hide note and due date" : "+ Add note or due date"}
      </button>
      {showMore && (
        <div className="mb-2">
          <Field label="Note"><input className={inputCls} value={note} onChange={(e) => setNote(e.target.value)} placeholder="Optional" /></Field>
          {!family && <Field label="Due date"><input type="date" className={inputCls} value={dueDate} onChange={(e) => setDueDate(e.target.value)} /></Field>}
        </div>
      )}

      <button disabled={!canSave} onClick={save} className="w-full bg-indigo-950 text-amber-50 rounded-xl py-3 font-semibold text-sm disabled:opacity-40">
        Save debt
      </button>
    </Modal>
  );
}

function PayDebtModal({ debt, data, incomeMembers, paidSoFar, onClose, onSave }) {
  const payerMembers = data.members;
  const remaining = debt.totalAmount - paidSoFar;
  const [amount, setAmount] = useState(remaining);
  const [memberId, setMemberId] = useState(payerMembers[0]?.id || "");
  const [splitMode, setSplitMode] = useState("single");

  const buildPaidFrom = () => {
    if (debt.direction !== "i_owe") return [];
    if (splitMode === "equal") {
      const each = Math.round((amount / payerMembers.length) * 100) / 100;
      return payerMembers.map((m) => ({ memberId: m.id, amount: each }));
    }
    return [{ memberId, amount: Number(amount) }];
  };

  return (
    <Modal title={`Record payment · ${debt.personName}`} onClose={onClose}>
      <Field label="Amount">
        <input type="number" step="any" inputMode="decimal" className={inputCls} value={amount} onChange={(e) => setAmount(e.target.value)} />
      </Field>
      {debt.direction === "i_owe" ? (

function AddTransactionModal({ type, editingTx, data, defaultCategoryId, incomeMembers, onClose, onSave, onUpdate, onAddCategory }) {
  const editing = editingTx || null;
  // Anyone can be the actual payer (even without regular income, e.g. paying from savings) —
  // so "Paid from whose money" draws from every family member, not just income sources.
  const payerMembers = data.members;
  // Work out the split mode/values from an existing transaction's paidFrom.
  const derivedSplit = (() => {
    const pf = editing?.paidFrom || [];
    const emptyCustom = Object.fromEntries(payerMembers.map((m) => [m.id, ""]));
    if (pf.length === 0) return { mode: "equal", single: payerMembers[0]?.id || "", custom: emptyCustom };
    if (pf.length === 1) return { mode: "single", single: pf[0].memberId, custom: emptyCustom };
    const allEqual = pf.every((p) => Math.abs(p.amount - pf[0].amount) < 0.01);
    if (allEqual && pf.length === payerMembers.length) return { mode: "equal", single: payerMembers[0]?.id || "", custom: emptyCustom };
    return {
      mode: "custom",
      single: payerMembers[0]?.id || "",
      custom: Object.fromEntries(payerMembers.map((m) => [m.id, String(pf.find((x) => x.memberId === m.id)?.amount ?? "")])),
    };
  })();

  const [amount, setAmount] = useState(editing ? String(editing.amount) : "");
  const [categoryId, setCategoryId] = useState(editing?.categoryId || (data.categories.some((c) => c.id === defaultCategoryId) ? defaultCategoryId : null) || data.categories.find((c) => !c.isSystem)?.id || "");
  const [showNewCategory, setShowNewCategory] = useState(false);
  const [categories, setCategories] = useState(data.categories);

  const handleAddCategory = (c) => {
    const newCat = onAddCategory(c);
    setCategories((prev) => [...prev, newCat]);
    setCategoryId(newCat.id);
    setShowNewCategory(false);
  };
  const [spentBy, setSpentBy] = useState((editing && type === "expense" ? editing.memberId : null) || data.members[0]?.id || "");
  const [incomeSource, setIncomeSource] = useState((editing && type === "income" ? editing.memberId : null) || incomeMembers[0]?.id || "");
  const [placeId, setPlaceId] = useState(editing?.placeId || "");
  const [allowanceId, setAllowanceId] = useState(editing?.allowanceId || "");
  const [date, setDate] = useState(editing?.date || todayISO());
  const [note, setNote] = useState(editing?.note || "");
  const [splitMode, setSplitMode] = useState(derivedSplit.mode);
  const [singlePayer, setSinglePayer] = useState(
    (!editing && payerMembers.some((m) => m.id === spentBy)) ? spentBy : derivedSplit.single
  );
  const [customSplit, setCustomSplit] = useState(derivedSplit.custom);

  // Keep "Paid from whose money" in sync with "Spent by" by default —
  // most of the time the same person spends and pays, so avoid asking twice.
  useEffect(() => {
    if (editing) return; // don't override an existing transaction's saved split
    if (splitMode !== "single") return;
    if (payerMembers.some((m) => m.id === spentBy)) {
      setSinglePayer(spentBy);
    }
  }, [spentBy, splitMode]);

  // Family IOU: person A paid now, person B repays A later (add mode only).
  const [isLoan, setIsLoan] = useState(false);
  const [lenderId, setLenderId] = useState(data.members[0]?.id || "");
  const [borrowerId, setBorrowerId] = useState(data.members[1]?.id || data.members[0]?.id || "");
  const [owedAmount, setOwedAmount] = useState("");

  const [showMore, setShowMore] = useState(!!(editing && (editing.placeId || editing.allowanceId)));
  const dayISO = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return localISO(d); };
  const lbl = "block text-xs font-semibold text-stone-500 mb-2 uppercase tracking-wide";

  const amt = Number(amount) || 0;

  const buildPaidFrom = () => {
    if (splitMode === "equal") {
      const each = Math.round((amt / payerMembers.length) * 100) / 100;
      return payerMembers.map((m) => ({ memberId: m.id, amount: each }));
    }
    if (splitMode === "single") return [{ memberId: singlePayer, amount: amt }];
    return payerMembers.filter((m) => Number(customSplit[m.id]) > 0).map((m) => ({ memberId: m.id, amount: Number(customSplit[m.id]) }));
  };

  const customSum = Object.values(customSplit).reduce((s, v) => s + (Number(v) || 0), 0);

  return (
    <Modal title={editing ? (type === "income" ? "Edit income" : "Edit expense") : (type === "income" ? "Add income" : "Add expense")} onClose={onClose}>
      {/* amount */}
      <div className={`rounded-2xl p-4 mb-4 text-center ${type === "income" ? "bg-emerald-50" : "bg-rose-50"}`}>
        <div className={`text-xs font-semibold uppercase tracking-wide mb-1 ${type === "income" ? "text-emerald-700" : "text-rose-700"}`}>{type === "income" ? "Income amount" : "Expense amount"}</div>
        <div className="flex items-center justify-center gap-1">
          <span className="text-3xl font-mono text-stone-400">₹</span>
          <input type="number" step="any" inputMode="decimal" autoFocus value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0"
            className="w-44 text-4xl font-mono font-semibold text-center bg-transparent outline-none text-stone-800 placeholder:text-stone-300" />
        </div>
      </div>

      {/* category grid */}
      {type === "expense" && (
        <div className="mb-4">
          <div className={lbl}>Category</div>
          <div className="grid grid-cols-3 gap-2 max-h-52 overflow-y-auto pr-0.5">
            {categories.filter((c) => !c.isSystem).map((c) => {
              const sel = categoryId === c.id;
              return (
                <button key={c.id} type="button" onClick={() => setCategoryId(c.id)}
                  className="flex flex-col items-center gap-1.5 p-2.5 rounded-xl border-2 transition"
                  style={sel ? { borderColor: c.color, backgroundColor: `${c.color}14` } : { borderColor: "transparent", backgroundColor: "#f5f5f4" }}>
                  <IconBadge iconName={c.icon} color={c.color} size="sm" />
                  <span className={`text-xs leading-tight text-center w-full truncate ${sel ? "font-semibold text-stone-900" : "text-stone-600"}`}>{c.name}</span>
                </button>
              );
            })}
            <button type="button" onClick={() => setShowNewCategory((v) => !v)}
              className="flex flex-col items-center justify-center gap-1 p-2.5 rounded-xl border-2 border-dashed border-stone-300 text-stone-500">
              <Plus size={18} /><span className="text-xs">New</span>
            </button>
          </div>
          {showNewCategory && (
            <div className="mt-2 p-3 rounded-xl bg-stone-50 border border-stone-200">
              <NewCategoryForm existingCount={data.categories.length} onSave={handleAddCategory} compact />
            </div>
          )}
        </div>
      )}

      {/* who */}
      <div className="mb-4">
        <div className={lbl}>{type === "expense" ? "Spent by" : "Income source"}</div>
        <div className="flex flex-wrap gap-2">
          {(type === "expense" ? data.members : incomeMembers).map((m) => {
            const sel = (type === "expense" ? spentBy : incomeSource) === m.id;
            return (
              <button key={m.id} type="button" onClick={() => (type === "expense" ? setSpentBy(m.id) : setIncomeSource(m.id))}
                className={`flex items-center gap-1.5 pl-1 pr-3 py-1 rounded-full border text-sm font-medium transition ${sel ? "bg-indigo-950 text-amber-50 border-indigo-950" : "bg-white text-stone-600 border-stone-300"}`}>
                <Avatar member={m} size="sm" />{m.name}
              </button>
            );
          })}
        </div>
      </div>

      {/* date + note */}
      <div className="mb-4">
        <div className={lbl}>Date</div>
        <div className="flex items-center gap-2">
          <Pill active={date === dayISO(0)} onClick={() => setDate(dayISO(0))}>Today</Pill>
          <Pill active={date === dayISO(-1)} onClick={() => setDate(dayISO(-1))}>Yesterday</Pill>
          <input type="date" className={inputCls + " flex-1 min-w-0"} value={date} onChange={(e) => setDate(e.target.value)} />
        </div>
      </div>
      <Field label="Note">
        <input className={inputCls} value={note} onChange={(e) => setNote(e.target.value)} placeholder="Optional, e.g. milk, auto fare" />
      </Field>

      {/* more options */}
      <button type="button" onClick={() => setShowMore((v) => !v)} className="w-full flex items-center justify-between py-3 px-3.5 rounded-xl bg-stone-50 border border-stone-200 mb-3 text-left">
        <div>
          <div className="text-sm font-semibold text-stone-700">More options</div>
          <div className="text-xs text-stone-500">
            {type === "expense"
              ? (splitMode === "equal" ? "Paid: split equally" : splitMode === "single" ? `Paid by ${payerMembers.find((m) => m.id === singlePayer)?.name || "?"}` : "Paid: custom split") + " · account, family IOU"
              : "Account"}
          </div>
        </div>
        <ChevronDown size={18} className={`text-stone-400 transition-transform ${showMore ? "rotate-180" : ""}`} />
      </button>
      {showMore && (
        <div className="mb-2">
      {type === "expense" && (
        <Field label="Paid from whose money">
          <div className="flex gap-2 mb-2 flex-wrap">
            <Pill active={splitMode === "equal"} onClick={() => setSplitMode("equal")}>Split equally</Pill>
            <Pill active={splitMode === "single"} onClick={() => setSplitMode("single")}>One person</Pill>
            <Pill active={splitMode === "custom"} onClick={() => setSplitMode("custom")}>Custom split</Pill>
          </div>
          {splitMode === "single" && (
            <select className={inputCls} value={singlePayer} onChange={(e) => setSinglePayer(e.target.value)}>
              {payerMembers.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          )}
          {splitMode === "custom" && (
            <div className="space-y-2">
              {payerMembers.map((m) => (
                <div key={m.id} className="flex items-center gap-2">
                  <span className="text-xs w-20 truncate">{m.name}</span>
                  <input
                    type="number" step="any" inputMode="decimal"
                    className={inputCls}
                    value={customSplit[m.id]}
                    onChange={(e) => setCustomSplit({ ...customSplit, [m.id]: e.target.value })}
                  />
                </div>
              ))}
              <div className={`text-[11px] ${customSum !== amt ? "text-rose-600" : "text-emerald-600"}`}>
                {fmt(customSum)} of {fmt(amt)} allocated
              </div>
            </div>
          )}
          {splitMode === "equal" && payerMembers.length > 0 && (
            <p className="text-[11px] text-stone-400">
              {fmt(amt / payerMembers.length || 0)} each from {payerMembers.map((m) => m.name).join(", ")}
            </p>
          )}
        </Field>
      )}

      {type === "expense" && !editing && data.members.length >= 2 && (
        <Field label="Will someone repay you? (family IOU)">
          <div className="flex gap-2 mb-2">
            <Pill active={!isLoan} onClick={() => setIsLoan(false)}>No</Pill>
            <Pill active={isLoan} onClick={() => setIsLoan(true)}>Yes, someone owes it back</Pill>
          </div>
          {isLoan && (
            <div className="space-y-2.5 p-3 rounded-xl bg-stone-50 border border-stone-200">
              <div>
                <label className="block text-[11px] font-medium text-stone-500 mb-1">Paid now by (will be repaid)</label>
                <select className={inputCls} value={lenderId} onChange={(e) => setLenderId(e.target.value)}>
                  {data.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-stone-500 mb-1">Will repay (owes the money)</label>
                <select className={inputCls} value={borrowerId} onChange={(e) => setBorrowerId(e.target.value)}>
                  {data.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-stone-500 mb-1">Amount owed</label>
                <input type="number" step="any" inputMode="decimal" className={inputCls} value={owedAmount} onChange={(e) => setOwedAmount(e.target.value)} placeholder={`Full amount (${fmt(amt)})`} />
              </div>
              {lenderId === borrowerId ? (
                <p className="text-[11px] text-rose-600">Payer and the person who owes must be different.</p>
              ) : (
                <p className="text-[11px] text-stone-400">
                  {(data.members.find((m) => m.id === borrowerId)?.name) || "?"} will owe {(data.members.find((m) => m.id === lenderId)?.name) || "?"} {fmt(Number(owedAmount) || amt)}. This shows up in the Debts tab.
                </p>
              )}
            </div>
          )}
        </Field>
      )}

      {(data.places || []).length > 0 && (
        <Field label={type === "income" ? "Add to which place?" : "Spend from which place?"}>
          <select className={inputCls} value={placeId} onChange={(e) => setPlaceId(e.target.value)}>
            <option value="">Don't track against a place</option>
            {data.places.map((p) => {
              const owner = data.members.find((m) => m.id === p.ownerId);
              return <option key={p.id} value={p.id}>{p.name}{owner ? ` · ${owner.name}` : " · Shared"} ({fmt(p.balance)})</option>;
            })}
          </select>
        </Field>
      )}

      {type === "expense" && (data.allowances || []).length > 0 && (
        <Field label="Spend from Ghar Kharcha allowance?">
          <select className={inputCls} value={allowanceId} onChange={(e) => setAllowanceId(e.target.value)}>
            <option value="">Not from an allowance</option>
            {data.allowances.map((a) => {
              const m = data.members.find((mm) => mm.id === a.memberId);
              return <option key={a.id} value={a.id}>{m?.name || "?"}'s allowance ({fmt(a.balance)} left)</option>;
            })}
          </select>
        </Field>
      )}

        </div>
      )}

      <button
        disabled={!amt || (type === "expense" && splitMode === "custom" && customSum !== amt) || (type === "expense" && payerMembers.length === 0) || (type === "expense" && !editing && isLoan && lenderId === borrowerId)}
        onClick={() => {
          const payload = {
            type, amount: amt, categoryId: type === "expense" ? categoryId : null,
            memberId: type === "expense" ? spentBy : incomeSource,
            date, note, paidFrom: type === "expense" ? buildPaidFrom() : [],
            placeId: placeId || null,
            allowanceId: type === "expense" ? (allowanceId || null) : null,
          };
          if (editing) {
            onUpdate(editing.id, payload); // debtId/recurringId preserved from the original
          } else {
            const loan =
              type === "expense" && isLoan && lenderId && borrowerId && lenderId !== borrowerId
                ? {
                    lenderId,
                    borrowerId,
                    amount: Number(owedAmount) || amt,
                    label: data.categories.find((c) => c.id === categoryId)?.name || "",
                  }
                : null;
            onSave({ ...payload, debtId: null, recurringId: null }, loan);
          }
        }}
        className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40 mt-1"
      >
        {editing ? "Save changes" : `Save ${type === "income" ? "income" : "expense"}`}{amt ? ` · ${fmt(amt)}` : ""}
      </button>
      {type === "expense" && splitMode === "custom" && amt > 0 && customSum !== amt && (
        <p className="text-xs text-rose-600 mt-2">The custom split must add up to {fmt(amt)}. Open More options to fix it.</p>
      )}
      {type === "expense" && !editing && isLoan && lenderId === borrowerId && (
        <p className="text-xs text-rose-600 mt-2">For the family IOU, choose two different people in More options.</p>
      )}
      {type === "expense" && payerMembers.length === 0 && (
        <p className="text-xs text-rose-600 mt-2">Add at least one family member first (top-right avatars → Manage members).</p>
      )}
    </Modal>
  );
}

import ReactDOM from "react-dom/client";
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
