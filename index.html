function AuthScreen() {
  const [mode, setMode] = useState("signin"); // signin | signup
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);

  function friendlyError(code) {
    if (code === "auth/email-already-in-use") return "That email already has an account — try signing in instead.";
    if (code === "auth/invalid-email") return "That doesn't look like a valid email address.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "Wrong email or password.";
    if (code === "auth/user-not-found") return "No account with that email — try signing up instead.";
    if (code === "auth/too-many-requests") return "Too many attempts — please wait a moment and try again.";
    return "Something went wrong. Please try again.";
  }

  async function submit(e) {
    e.preventDefault();
    setError("");
    if (!email || !password) return;
    setBusy(true);
    try {
      if (mode === "signup") {
        await createUserWithEmailAndPassword(auth, email.trim(), password);
      } else {
        await signInWithEmailAndPassword(auth, email.trim(), password);
      }
    } catch (e) {
      setError(friendlyError(e.code));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="min-h-screen flex items-center justify-center bg-stone-50 px-4">
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center gap-2 mb-6">
          <div className="w-14 h-14 rounded-full bg-indigo-950 flex items-center justify-center text-amber-400">
            <Stamp size={26} />
          </div>
          <h1 className="font-serif text-2xl text-indigo-950">Home Ledger</h1>
          <p className="text-xs text-stone-500">Shared family ledger</p>
        </div>
        <Card className="p-5">
          <div className="flex gap-1.5 mb-4 bg-stone-100 rounded-full p-1">
            <button
              onClick={() => { setMode("signin"); setError(""); }}
              className={`flex-1 text-sm font-semibold rounded-full py-1.5 transition-colors ${mode === "signin" ? "bg-indigo-950 text-amber-50" : "text-stone-500"}`}
            >
              Sign in
            </button>
            <button
              onClick={() => { setMode("signup"); setError(""); }}
              className={`flex-1 text-sm font-semibold rounded-full py-1.5 transition-colors ${mode === "signup" ? "bg-indigo-950 text-amber-50" : "text-stone-500"}`}
            >
              Sign up
            </button>
          </div>
          <form onSubmit={submit} className="space-y-3">
            <Field label="Email">
              <div className="relative">
                <Mail size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
                <input
                  type="email" required autoComplete="email" value={email}
                  onChange={(e) => setEmail(e.target.value)}
                  className={inputCls + " pl-9"} placeholder="you@example.com"
                />
              </div>
            </Field>
            <Field label="Password">
              <div className="relative">
                <KeyRound size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
                <input
                  type="password" required minLength={6}
                  autoComplete={mode === "signup" ? "new-password" : "current-password"}
                  value={password} onChange={(e) => setPassword(e.target.value)}
                  className={inputCls + " pl-9"} placeholder="At least 6 characters"
                />
              </div>
            </Field>
            {error && <p className="text-xs text-rose-600">{error}</p>}
            <button
              type="submit" disabled={busy}
              className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-50"
            >
              {busy ? "Please wait…" : mode === "signup" ? "Create account" : "Sign in"}
            </button>
          </form>
        </Card>
        {mode === "signup" && (
          <p className="text-[11px] text-stone-400 text-center mt-4 leading-relaxed">
            After signing up, an existing family member will need to approve your account before you can see the ledger.
          </p>
        )}
      </div>
    </div>
  );
}

  useEffect(() => {
    if (!authUser) return;
    const unsub = onSnapshot(allowlistRef, (snap) => {
      setAllowlist(snap.exists() ? snap.data() : null);
    });
    return unsub;
  }, [authUser]);

  useEffect(() => {
    (async () => {
      if (!authUser || allowlist !== null || bootstrapping) return;
      setBootstrapping(true);
      try {
        const snap = await getDoc(allowlistRef);
        if (!snap.exists()) {
          await setDoc(allowlistRef, {
            ownerUid: authUser.uid,
            approvedUids: [authUser.uid],
            emails: { [authUser.uid]: authUser.email || "" },
          });
          await setDoc(ledgerRef, seedData());
        }
      } catch (e) {
        // ignore; onSnapshot above will retry state on next change
      }
      setBootstrapping(false);
    })();
  }, [authUser, allowlist, bootstrapping]);

  const isApproved = !!(authUser && allowlist && allowlist.approvedUids?.includes(authUser.uid));
  const isOwner = !!(authUser && allowlist && allowlist.ownerUid === authUser.uid);

  useEffect(() => {
    (async () => {
      if (!authUser || !allowlist || isApproved) return;
      try {
        await setDoc(doc(db, "requests", authUser.uid), { email: authUser.email || "", requestedAt: Date.now() }, { merge: true });
      } catch (e) {}
    })();
  }, [authUser, allowlist, isApproved]);

  useEffect(() => {
    if (!isOwner) { setRequests([]); return; }
    const unsub = onSnapshot(requestsCol, (snap) => {
      setRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, [isOwner]);

  async function approveRequest(uid, email) {
    await updateDoc(allowlistRef, {
      approvedUids: arrayUnion(uid),
      [`emails.${uid}`]: email || "",
    });
    await deleteDoc(doc(db, "requests", uid));
  }
  async function denyRequest(uid) {
    await deleteDoc(doc(db, "requests", uid));
  }
  async function transferOwnership(uid) {
    await updateDoc(allowlistRef, { ownerUid: uid });
  }
  function handleSignOut() {
    signOut(auth);
  }

  if (!authChecked) return <FullScreenLoader label="Loading…" />;
  if (!authUser) return <AuthScreen />;
  if (allowlist === undefined || bootstrapping) return <FullScreenLoader label="Setting things up…" />;
  if (!isApproved) return <PendingScreen email={authUser.email} onSignOut={handleSignOut} />;

  return (
    <Ledger
      user={authUser}
      isOwner={isOwner}
      requests={requests}
      allowlist={allowlist}
      onApprove={approveRequest}
      onDeny={denyRequest}
      onSignOut={handleSignOut}
      onTransferOwner={transferOwnership}
    />
  );
}

function Ledger({ user, isOwner, requests, allowlist, onApprove, onDeny, onSignOut, onTransferOwner }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [viewMode, setViewMode] = useState("family");
  const [lang, setLang] = useState("en");
  const t = (key) => TRANSLATIONS[key]?.[lang] || TRANSLATIONS[key]?.en || key;
  const [showAddTx, setShowAddTx] = useState(null);
  const [editTx, setEditTx] = useState(null);
  const [showMembers, setShowMembers] = useState(false);
  const [showRecurringModal, setShowRecurringModal] = useState(false);
  const [showAddRecurring, setShowAddRecurring] = useState(false);
  const [showAddDebt, setShowAddDebt] = useState(false);
  const [payDebt, setPayDebt] = useState(null);
  const [filters, setFilters] = useState({ q: "", category: "all", member: "all", from: "", to: "" });
  const [incomeFilters, setIncomeFilters] = useState({ q: "", category: "all", member: "all", from: "", to: "" });

  const goToCategory = (categoryId) => {
    setFilters({ q: "", category: categoryId, member: "all", from: "", to: "" });
    setTab("transactions");
  };

  useEffect(() => {
    let seeding = false;
    const unsub = onSnapshot(
      ledgerRef,
      async (snap) => {
        if (snap.exists()) {
          setData(snap.data());
          setLoading(false);
        } else if (isOwner && !seeding) {
          seeding = true;
          const seed = seedData();
          try {
            await setDoc(ledgerRef, seed);
          } catch (e) {}
        } else {
          setLoading(false);
        }
      },
      () => setLoading(false)
    );
    return unsub;
  }, [isOwner]);

  useEffect(() => {
    if (data && viewMode !== "family" && !data.members.some((m) => m.id === viewMode)) {
      setViewMode("family");
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data, viewMode]);

  async function persist(next) {
    setData(next);
    try {
      await setDoc(ledgerRef, next);
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }

  /* ---------- mutators ---------- */
  const addTransaction = (tx) => {
    const newTx = { id: uid("t"), ...tx };
    let places = data.places || [];
    if (newTx.placeId) {
      const delta = newTx.type === "income" ? newTx.amount : -newTx.amount;
      places = places.map((p) => (p.id === newTx.placeId ? { ...p, balance: (p.balance || 0) + delta } : p));
    }
    persist({ ...data, transactions: [newTx, ...data.transactions], places });
  };
  // Adds an expense and, optionally, a family IOU debt (member B owes member A)
  // in a single save so both land together.
  const addTransactionWithDebt = (tx, loan) => {
    const newTx = { id: uid("t"), ...tx };
    let places = data.places || [];
    if (newTx.placeId) {
      const delta = newTx.type === "income" ? newTx.amount : -newTx.amount;
      places = places.map((p) => (p.id === newTx.placeId ? { ...p, balance: (p.balance || 0) + delta } : p));
    }
    let debts = data.debts;
    if (loan && loan.amount > 0 && loan.lenderId && loan.borrowerId && loan.lenderId !== loan.borrowerId) {
      const lender = data.members.find((m) => m.id === loan.lenderId);
      const borrower = data.members.find((m) => m.id === loan.borrowerId);
      debts = [
        ...debts,
        {
          id: uid("d"),
          personName: `${borrower?.name || "?"} → ${lender?.name || "?"}`,
          direction: "owed_to_me",
          internal: true,
          fromMember: loan.borrowerId,
          toMember: loan.lenderId,
          totalAmount: loan.amount,
          dueDate: "",
          note: newTx.note || loan.label || "",
        },
      ];
    }
    persist({ ...data, transactions: [newTx, ...data.transactions], places, debts });
  };
  const deleteTransaction = (id) => {
    const tx = data.transactions.find((t) => t.id === id);
    let places = data.places || [];
    if (tx && tx.placeId) {
      const delta = tx.type === "income" ? -tx.amount : tx.amount;
      places = places.map((p) => (p.id === tx.placeId ? { ...p, balance: (p.balance || 0) + delta } : p));
    }
    persist({ ...data, transactions: data.transactions.filter((t) => t.id !== id), places });
  };
  const updateTransaction = (id, patch) => {
    const old = data.transactions.find((t) => t.id === id);
    if (!old) return;
    const updated = { ...old, ...patch };
    let places = data.places || [];
    // 1) reverse the old transaction's effect on its place
    if (old.placeId) {
      const revert = old.type === "income" ? -old.amount : old.amount;
      places = places.map((p) => (p.id === old.placeId ? { ...p, balance: (p.balance || 0) + revert } : p));
    }
    // 2) apply the updated transaction's effect on its (possibly new) place
    if (updated.placeId) {
      const apply = updated.type === "income" ? updated.amount : -updated.amount;
      places = places.map((p) => (p.id === updated.placeId ? { ...p, balance: (p.balance || 0) + apply } : p));
    }
    persist({ ...data, transactions: data.transactions.map((t) => (t.id === id ? updated : t)), places });
  };
  const addPlace = (p) => persist({ ...data, places: [...(data.places || []), { id: uid("pl"), ...p }] });
  const updatePlace = (id, patch) => persist({ ...data, places: (data.places || []).map((p) => (p.id === id ? { ...p, ...patch } : p)) });
  const deletePlace = (id) =>
    persist({
      ...data,
      places: (data.places || []).filter((p) => p.id !== id),
      transactions: data.transactions.map((t) => (t.placeId === id ? { ...t, placeId: null } : t)),
    });
  const adjustPlace = (id, delta) =>
    persist({ ...data, places: (data.places || []).map((p) => (p.id === id ? { ...p, balance: (p.balance || 0) + delta } : p)) });
  const addMember = (m) => persist({ ...data, members: [...data.members, { id: uid("m"), ...m }] });
  const updateMember = (id, patch) => persist({ ...data, members: data.members.map((m) => (m.id === id ? { ...m, ...patch } : m)) });
  const deleteMember = (id) => persist({ ...data, members: data.members.filter((m) => m.id !== id) });
  const updateCategory = (id, patch) => persist({ ...data, categories: data.categories.map((c) => (c.id === id ? { ...c, ...patch } : c)) });
  const addCategory = (c) => {
    const newCat = { id: uid("cat"), ...c };
    persist({ ...data, categories: [...data.categories, newCat] });
    return newCat;
  };
  const deleteCategory = (id) => persist({ ...data, categories: data.categories.filter((c) => c.id !== id) });
  const addDebt = (d) => persist({ ...data, debts: [...data.debts, { id: uid("d"), ...d }] });
  const deleteDebt = (id) => persist({ ...data, debts: data.debts.filter((d) => d.id !== id), transactions: data.transactions.filter((t) => t.debtId !== id) });
  const settleDebt = (id) => persist({ ...data, debts: data.debts.map((d) => (d.id === id ? { ...d, settled: true, settledDate: todayISO() } : d)) });
  const reopenDebt = (id) => persist({ ...data, debts: data.debts.map((d) => (d.id === id ? { ...d, settled: false, settledDate: "" } : d)) });
  const addRecurring = (r) => persist({ ...data, recurring: [...data.recurring, { id: uid("r"), ...r }] });
  const toggleRecurring = (id) => persist({ ...data, recurring: data.recurring.map((r) => (r.id === id ? { ...r, active: !r.active } : r)) });
  const deleteRecurring = (id) => persist({ ...data, recurring: data.recurring.filter((r) => r.id !== id) });
  const updateSettings = (patch) => persist({ ...data, settings: { ...data.settings, ...patch } });

  const applyRecurring = (r) => {
    const paidFrom =
      r.type === "expense"
        ? splitEqually(r.amount, incomeMembers.map((m) => m.id))
        : [];
    const date = `${thisMonthKey()}-${String(r.dayOfMonth || 1).padStart(2, "0")}`;
    addTransaction({
      type: r.type, amount: r.amount, categoryId: r.categoryId, memberId: r.memberId,
      date, note: r.note, paidFrom, recurringId: r.id, debtId: null,
    });
  };

  const resetDemo = () => persist(seedData());
  const clearAll = () => persist({ members: [], categories: DEFAULT_CATEGORIES, transactions: [], debts: [], recurring: [], recurringLog: {}, settings: { overallBudget: 0 } });

  /* ---------- derived ---------- */
  const incomeMembers = useMemo(() => (data ? data.members.filter((m) => m.isIncomeSource) : []), [data]);

  const currentMonthTx = useMemo(
    () => (data ? data.transactions.filter((t) => monthKeyOf(t.date) === thisMonthKey()) : []),
    [data]
  );

  const categorySpendThisMonth = (catId) =>
    currentMonthTx.filter((t) => t.type === "expense" && t.categoryId === catId).reduce((s, t) => s + t.amount, 0);

  const familyTotals = useMemo(() => {
    if (!data) return { income: 0, expense: 0 };
    const income = currentMonthTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
    const expense = currentMonthTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
    return { income, expense };
  }, [currentMonthTx, data]);

  const netWorth = useMemo(() => {
    if (!data) return 0;
    const allIncome = data.transactions.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
    const allExpense = data.transactions.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
    const cash = allIncome - allExpense;
    const owedToMe = data.debts.filter((d) => d.direction === "owed_to_me" && !d.internal).reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
    const iOwe = data.debts.filter((d) => d.direction === "i_owe" && !d.internal).reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
    return cash + owedToMe - iOwe;
  }, [data]);

  function paidOnDebt(debtId) {
    return data.transactions.filter((t) => t.debtId === debtId).reduce((s, t) => s + t.amount, 0);
  }

  const memberBalance = (memberId) => {
    const income = data.transactions.filter((t) => t.type === "income" && t.memberId === memberId).reduce((s, t) => s + t.amount, 0);
    const funded = data.transactions
      .filter((t) => t.type === "expense")
      .reduce((s, t) => s + (t.paidFrom || []).filter((p) => p.memberId === memberId).reduce((x, p) => x + p.amount, 0), 0);
    return income - funded;
  };
  const memberIncomeThisMonth = (memberId) =>
    currentMonthTx.filter((t) => t.type === "income" && t.memberId === memberId).reduce((s, t) => s + t.amount, 0);
  const memberFundedThisMonth = (memberId) =>
    currentMonthTx
      .filter((t) => t.type === "expense")
      .reduce((s, t) => s + (t.paidFrom || []).filter((p) => p.memberId === memberId).reduce((x, p) => x + p.amount, 0), 0);
  const memberSpentThisMonth = (memberId) =>
    currentMonthTx.filter((t) => t.type === "expense" && t.memberId === memberId).reduce((s, t) => s + t.amount, 0);
  const memberCategoryBreakdown = (memberId) =>
    data.categories
      .map((c) => ({
        name: c.name,
        color: c.color,
        value: currentMonthTx.filter((t) => t.type === "expense" && t.memberId === memberId && t.categoryId === c.id).reduce((s, t) => s + t.amount, 0),
      }))
      .filter((d) => d.value > 0);
  const memberOwnTransactions = (memberId) =>
    data.transactions.filter((t) => t.type === "expense" && t.memberId === memberId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
  const toggleShareWith = (ownerId, targetId) => {
    const owner = data.members.find((m) => m.id === ownerId);
    if (!owner) return;
    const list = owner.sharedWith || [];
    const next = list.includes(targetId) ? list.filter((id) => id !== targetId) : [...list, targetId];
    updateMember(ownerId, { sharedWith: next });
  };

  const pendingRecurring = useMemo(() => {
    if (!data) return [];
    return data.recurring.filter(
      (r) => r.active && !data.transactions.some((t) => t.recurringId === r.id && monthKeyOf(t.date) === thisMonthKey())
    );
  }, [data]);

  const monthlyTrend = useMemo(() => {
    if (!data) return [];
    return buildTrendSeries(
      data.transactions, data.categories,
      (d) => monthKeyOf(d),
      (k) => monthLabel(k),
      (k) => monthLabel(k),
    ).slice(-6);
  }, [data]);

  const yearlyTrend = useMemo(() => {
    if (!data) return [];
    return buildTrendSeries(
      data.transactions, data.categories,
      (d) => (d || "").slice(0, 4),
      (k) => k,
      (k) => `Year ${k}`,
    );
  }, [data]);

  const dailyThisMonth = useMemo(() => {
    if (!data) return [];
    const mk = thisMonthKey();
    return buildTrendSeries(
      data.transactions.filter((t) => monthKeyOf(t.date) === mk),
      data.categories,
      (d) => d,
      (k) => new Date(k).toLocaleDateString("en-IN", { day: "numeric", month: "short" }),
      (k) => new Date(k).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" }),
    );
  }, [data]);

  const categoryPie = useMemo(() => {
    if (!data) return [];
    return data.categories
      .map((c) => ({ id: c.id, name: c.name, value: categorySpendThisMonth(c.id), color: c.color }))
      .filter((d) => d.value > 0);
  }, [data, currentMonthTx]);

  // Shared filtering + deep search used by both the Split/Transaction tab
  // (expenses) and the Income tab. `typeWanted` limits to "expense" or "income".
  const runFilter = (f, typeWanted) => {
    if (!data) return [];
    const searchBlob = (t) => {
      const cat = data.categories.find((c) => c.id === t.categoryId);
      const mem = data.members.find((m) => m.id === t.memberId);
      const place = (data.places || []).find((p) => p.id === t.placeId);
      const splitNames = (t.paidFrom || [])
        .map((p) => data.members.find((m) => m.id === p.memberId)?.name)
        .filter(Boolean);
      return [t.note, cat?.name, mem?.name, place?.name, t.type, t.date, String(Math.round(t.amount || 0)), ...splitNames]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    };
    // Multiple words must all match: "electricity ramesh" narrows to both.
    const terms = (f.q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
    return data.transactions
      .filter((t) => (typeWanted ? t.type === typeWanted : true))
      .filter((t) => (f.category === "all" ? true : t.categoryId === f.category))
      .filter((t) => (f.member === "all" ? true : t.memberId === f.member || (t.paidFrom || []).some((p) => p.memberId === f.member)))
      .filter((t) => (f.from ? t.date >= f.from : true))
      .filter((t) => (f.to ? t.date <= f.to : true))
      .filter((t) => {
        if (terms.length === 0) return true;
        const blob = searchBlob(t);
        return terms.every((term) => blob.includes(term));
      })
      .sort((a, b) => b.date.localeCompare(a.date));
  };
  // Split / Transaction tab shows expenses only.
  const filteredTx = useMemo(() => runFilter(filters, "expense"), [data, filters]);
  // Income tab shows income only.
  const filteredIncome = useMemo(() => runFilter(incomeFilters, "income"), [data, incomeFilters]);

  function splitEqually(amount, memberIds) {
    if (!memberIds.length) return [];
    const each = Math.floor((amount / memberIds.length) * 100) / 100;
    const rem = Math.round((amount - each * memberIds.length) * 100) / 100;
    return memberIds.map((id, i) => ({ memberId: id, amount: i === 0 ? each + rem : each }));
  }

  function exportCSV() {
    const rows = [["Date", "Type", "Amount", "Category", "Spent By", "Paid From", "Note"]];
    data.transactions.forEach((t) => {
      const cat = data.categories.find((c) => c.id === t.categoryId)?.name || "";
      const member = data.members.find((m) => m.id === t.memberId)?.name || "";
      const paid = (t.paidFrom || []).map((p) => `${data.members.find((m) => m.id === p.memberId)?.name || "?"}:${p.amount}`).join(" | ");
      rows.push([t.date, t.type, t.amount, cat, member, paid, t.note || ""]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    downloadBlob(csv, "home-ledger-transactions.csv", "text/csv");
  }
  function exportJSON() {
    downloadBlob(JSON.stringify(data, null, 2), "home-ledger-backup.json", "application/json");
  }
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.members && parsed.transactions) persist(parsed);
      } catch (err) {}
    };
    reader.readAsText(file);
  }

  /* ---------- loading ---------- */
  if (loading || !data) {
    return (
      <div className="min-h-[400px] flex items-center justify-center bg-stone-50 rounded-2xl">
        <div className="flex flex-col items-center gap-3 text-stone-400">
          <RefreshCw className="animate-spin" size={28} />
          <span className="text-sm font-medium">{lang === "mr" ? TRANSLATIONS.loading.mr : TRANSLATIONS.loading.en}</span>
        </div>
      </div>
    );
  }

  const selectedMember = viewMode !== "family" ? data.members.find((m) => m.id === viewMode) : null;

  return (
    <LangContext.Provider value={{ lang, t }}>
    <div className="w-full min-h-screen bg-stone-50 text-stone-800 font-sans">
      {/* header */}
      <div className="bg-indigo-950 text-amber-50 px-4 sm:px-6 pt-5 pb-4 rounded-b-2xl">
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2.5">
            <div className="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-indigo-950">
              <Stamp size={20} />
            </div>
            <div>
              <h1 className="font-serif text-xl leading-tight">{t("appName")}</h1>
              <p className="text-xs text-indigo-300 tracking-wide">{t("tagline")}</p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <button
              onClick={() => setLang(lang === "en" ? "mr" : "en")}
              className="text-xs font-semibold bg-indigo-800 text-indigo-100 rounded-full px-3 py-1.5"
            >
              {lang === "en" ? "मराठी" : "English"}
            </button>
            <button onClick={() => setShowMembers(true)} className="flex items-center -space-x-2">
              {data.members.slice(0, 4).map((m) => (
                <Avatar key={m.id} member={m} size="sm" />
              ))}
              <div className="w-7 h-7 rounded-full bg-indigo-800 flex items-center justify-center text-[10px] ml-1 ring-2 ring-indigo-950">
                <SettingsIcon size={12} />
              </div>
            </button>
            <button onClick={onSignOut} title="Sign out" className="w-8 h-8 rounded-full bg-indigo-800 flex items-center justify-center text-indigo-100">
              <LogOut size={14} />
            </button>
          </div>
        </div>

        {/* family/individual toggle */}
        <div className="flex items-center gap-2 overflow-x-auto pb-1 -mx-1 px-1">
          <Pill active={viewMode === "family"} onClick={() => setViewMode("family")} icon={Users}>
            {t("family")}
          </Pill>
          {data.members.map((m) => (
            <Pill key={m.id} active={viewMode === m.id} onClick={() => setViewMode(m.id)} icon={User}>
              {m.name}
            </Pill>
          ))}
        </div>
      </div>

      {saveError && (
        <div className="mx-4 mt-3 text-sm bg-rose-50 text-rose-700 border border-rose-200 rounded-lg px-3 py-2 flex items-center gap-2">
          <AlertTriangle size={14} /> {t("saveFailed")}
        </div>
      )}

      {/* pending recurring banner */}
      {pendingRecurring.length > 0 && (
        <button
          onClick={() => setShowRecurringModal(true)}
          className="w-full text-left mx-4 mt-3 bg-amber-100 border border-amber-300 text-amber-900 rounded-xl px-4 py-3 flex items-center justify-between gap-2"
          style={{ width: "calc(100% - 2rem)" }}
        >

// Builds an income/expense series bucketed by keyOf(date), enriched with net,
// transaction count, and the top spending category for that bucket.
function buildTrendSeries(transactions, categories, keyOf, labelOf, titleOf) {
  const catName = (id) => (categories.find((c) => c.id === id) || {}).name || "Other";
  const map = {};
  transactions.forEach((t) => {
    const k = keyOf(t.date);
    if (!k) return;
    if (!map[k]) map[k] = { key: k, income: 0, expense: 0, count: 0, cats: {} };
    const row = map[k];
    row[t.type] += t.amount;
    row.count += 1;
    if (t.type === "expense") {
      const nm = catName(t.categoryId);
      row.cats[nm] = (row.cats[nm] || 0) + t.amount;
    }
  });
  return Object.values(map)
    .sort((a, b) => a.key.localeCompare(b.key))
    .map((r) => {
      const top = Object.entries(r.cats).sort((a, b) => b[1] - a[1])[0];
      return {
        key: r.key,
        income: r.income,
        expense: r.expense,
        count: r.count,
        net: r.income - r.expense,
        topCat: top ? top[0] : null,
        topCatAmount: top ? top[1] : 0,
        label: labelOf(r.key),
        title: (titleOf || labelOf)(r.key),
      };
    });
}

  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return (

function PersonDashboard({ member, data, onUpdateMember, onCategoryClick }) {
  const paidOnDebt = (id) => data.transactions.filter((t) => t.debtId === id).reduce((s, t) => s + t.amount, 0);
  const monthTx = data.transactions.filter((t) => monthKeyOf(t.date) === thisMonthKey());
  const incomeThisMonth = monthTx
    .filter((t) => t.type === "income" && t.memberId === member.id)
    .reduce((s, t) => s + t.amount, 0);
  // money that left this person's own pocket this month (their share of expenses)
  const spentThisMonth = monthTx
    .filter((t) => t.type === "expense")
    .reduce((s, t) => s + (t.paidFrom || []).filter((p) => p.memberId === member.id).reduce((x, p) => x + p.amount, 0), 0);

  // this person's own sources
  const sources = (data.places || []).filter((p) => p.ownerId === member.id);
  const sourcesTotal = sources.reduce((s, p) => s + (p.balance || 0), 0);

  // this person's debts (assigned to them) + family IOUs involving them
  const owedToThem = data.debts.filter(
    (d) => !isDebtSettled(d, data.transactions) &&
      ((d.direction === "owed_to_me" && d.memberId === member.id && !d.internal) || (d.internal && d.toMember === member.id))
  );
  const theyOwe = data.debts.filter(
    (d) => !isDebtSettled(d, data.transactions) &&
      ((d.direction === "i_owe" && d.memberId === member.id && !d.internal) || (d.internal && d.fromMember === member.id))
  );
  const owedAmt = owedToThem.reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
  const oweAmt = theyOwe.reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
  const netWorth = sourcesTotal + owedAmt - oweAmt;

  const budget = member.budget || 0;
  const budgetPct = budget ? (spentThisMonth / budget) * 100 : 0;
  const budgetRemaining = budget - spentThisMonth;

  const recentTx = data.transactions
    .filter((t) => t.type === "expense" && t.memberId === member.id)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 6);
  const recurringMine = (data.recurring || []).filter((r) => r.memberId === member.id);

  const [budgetInput, setBudgetInput] = useState(String(budget || ""));

  return (
    <div className="space-y-5">
      {/* personal net worth */}
      <Card className="p-5" style={{ background: `linear-gradient(135deg, ${member.color}, ${member.color}cc)` }}>
        <div className="flex items-center gap-3 mb-3">
          <Avatar member={member} size="lg" />
          <div>
            <div className="font-serif text-lg text-white">{member.name}</div>
            <div className="text-[11px] text-white/70">Personal net worth</div>
          </div>
        </div>
        <div className="font-mono text-3xl font-semibold text-white tabular-nums">{fmt(netWorth)}</div>
        <p className="text-[11px] text-white/70 mt-1">Own sources {fmt(sourcesTotal)} + owed {fmt(owedAmt)} − owe {fmt(oweAmt)}</p>
      </Card>

      {/* income / spent this month */}
      <div className="grid grid-cols-2 gap-3">
        <Card className="p-4">
          <div className="text-xs font-medium text-emerald-700 mb-1">Income (this month)</div>
          <div className="font-mono text-lg font-semibold text-emerald-700 tabular-nums">{fmt(incomeThisMonth)}</div>
        </Card>
        <Card className="p-4">
          <div className="text-xs font-medium text-rose-700 mb-1">Spent from own funds</div>
          <div className="font-mono text-lg font-semibold text-rose-700 tabular-nums">{fmt(spentThisMonth)}</div>
        </Card>
      </div>

      {/* personal monthly budget */}
      <Card className="p-4">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-sm font-semibold text-stone-600">My monthly budget</span>
          <div className="flex items-center gap-1">
            <span className="text-xs text-stone-400">₹</span>
            <input
              type="number"
              className="w-24 px-2 py-1 rounded-lg border border-stone-300 text-sm text-right"
              value={budgetInput}
              onChange={(e) => setBudgetInput(e.target.value)}
              onBlur={() => onUpdateMember(member.id, { budget: Number(budgetInput) || 0 })}
            />
          </div>
        </div>
        {budget > 0 ? (
          <>
            <ProgressBar pct={budgetPct} tone={budgetPct >= 100 ? "over" : budgetPct >= 80 ? "warn" : "ok"} />
            <div className="flex items-center justify-between mt-1.5">
              <span className="text-[11px] text-stone-400">{fmt(spentThisMonth)} of {fmt(budget)} spent</span>
              <span className={`text-[11px] font-mono font-semibold ${budgetRemaining < 0 ? "text-rose-600" : "text-stone-500"}`}>
                {budgetRemaining < 0 ? `${fmt(Math.abs(budgetRemaining))} over` : `${fmt(budgetRemaining)} left`}
              </span>
            </div>
          </>
        ) : (
          <p className="text-[11px] text-stone-400">Set a monthly budget above to track it.</p>
        )}
      </Card>

      {/* my sources */}
      <Card className="p-4">
        <div className="flex items-center justify-between mb-2">
          <h3 className="font-serif text-base text-indigo-950">My sources</h3>
          <span className="font-mono text-sm font-semibold text-stone-600 tabular-nums">{fmt(sourcesTotal)}</span>
        </div>
        <div className="space-y-2">
          {sources.map((p) => (
            <div key={p.id} className="flex items-center gap-2.5">
              <IconBadge iconName={p.icon} color={p.color} size="sm" />
              <span className="text-sm flex-1 min-w-0 truncate">{p.name}</span>
              <span className={`font-mono text-sm tabular-nums ${p.balance < 0 ? "text-rose-600" : "text-stone-500"}`}>{fmt(p.balance)}</span>
            </div>
          ))}
          {sources.length === 0 && <p className="text-xs text-stone-400">No sources yet. Add one in the Places tab and set "Belongs to" this person.</p>}
        </div>
      </Card>

      {/* my debts */}
      {(owedToThem.length > 0 || theyOwe.length > 0) && (
        <Card className="p-4">
          <h3 className="font-serif text-base text-indigo-950 mb-2">My debts</h3>
          {owedToThem.length > 0 && (
            <div className="mb-2">
              <div className="text-[11px] uppercase tracking-wide text-emerald-700 mb-1">Owed to {member.name}</div>
              {owedToThem.map((d) => (
                <div key={d.id} className="flex items-center justify-between text-sm py-0.5">
                  <span className="truncate">{d.personName}</span>
                  <span className="font-mono text-emerald-700 tabular-nums">{fmt(Math.max(0, d.totalAmount - paidOnDebt(d.id)))}</span>
                </div>
              ))}
            </div>
          )}
          {theyOwe.length > 0 && (
            <div>
              <div className="text-[11px] uppercase tracking-wide text-rose-700 mb-1">{member.name} owes</div>
              {theyOwe.map((d) => (
                <div key={d.id} className="flex items-center justify-between text-sm py-0.5">
                  <span className="truncate">{d.personName}</span>
                  <span className="font-mono text-rose-700 tabular-nums">{fmt(Math.max(0, d.totalAmount - paidOnDebt(d.id)))}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {/* my recurring */}
      {recurringMine.length > 0 && (
        <Card className="p-4">
          <h3 className="font-serif text-base text-indigo-950 mb-2">My recurring</h3>
          <div className="space-y-1.5">
            {recurringMine.map((r) => (
              <div key={r.id} className="flex items-center justify-between text-sm">
                <span className="truncate">{r.note || (r.type === "income" ? "Income" : "Expense")} · day {r.dayOfMonth}</span>
                <span className={`font-mono tabular-nums ${r.type === "income" ? "text-emerald-700" : "text-rose-700"}`}>
                  {r.type === "income" ? "+" : "−"}{fmt(r.amount)}
                </span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* recent spends */}
      <Card className="p-4">
        <h3 className="font-serif text-base text-indigo-950 mb-2">Recent spends</h3>
        <div className="space-y-2">
          {recentTx.map((t) => {
            const cat = data.categories.find((c) => c.id === t.categoryId);
            return (
              <div key={t.id} className="flex items-center gap-2.5">
                {cat && <IconBadge iconName={cat.icon} color={cat.color} size="sm" />}
                <div className="flex-1 min-w-0">
                  <div className="text-sm truncate">{t.note || cat?.name}</div>
                  <div className="text-[10px] text-stone-400">{t.date}</div>
                </div>
                <span className="font-mono text-sm text-rose-700">{fmt(t.amount)}</span>
              </div>
            );
          })}
          {recentTx.length === 0 && <p className="text-xs text-stone-400">No spends yet.</p>}
        </div>
      </Card>
    </div>
  );
}

function ShareAccessCard({ owner, allMembers, onToggle }) {
  const others = allMembers.filter((m) => m.id !== owner.id);
  const shared = owner.sharedWith || [];
  return (
    <Card className="p-4">
      <h3 className="font-serif text-base text-indigo-950 mb-1">Share my spending with</h3>
      <p className="text-xs text-stone-400 mb-3">{useLang().t("onlyTheseSee")}</p>
      <div className="flex flex-wrap gap-2">
        {others.map((m) => {
          const active = shared.includes(m.id);
          return (
            <button
              key={m.id}
              onClick={() => onToggle(owner.id, m.id)}
              className={`flex items-center gap-1.5 pl-1 pr-3 py-1 rounded-full border text-xs font-medium transition-colors ${
                active ? "bg-emerald-600 text-white border-emerald-600" : "bg-stone-100 text-stone-500 border-stone-200"

              <Avatar member={m} size="sm" />
              {m.name}
              {active && <Check size={12} />}
            </button>
          );
        })}
        {others.length === 0 && <p className="text-xs text-stone-400">Koi aur member nahi hai.</p>}
      </div>
    </Card>
  );
}

                  {t.placeId && (data.places || []).find((p) => p.id === t.placeId) && (

    <div className="space-y-4">

          <Wallet size={13} /> Total across places
        </div>
        <div className="font-mono text-3xl font-semibold tabular-nums">{fmt(total)}</div>

        </button>
      </div>

        {places.map((p) => (

            <div className="flex items-center gap-3">
              <IconBadge iconName={p.icon} color={p.color} size="sm" />
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium truncate flex items-center gap-1.5">
                  {p.name}
                  {p.ownerId
                    ? <span className="text-[9px] uppercase tracking-wide bg-stone-100 text-stone-500 px-1.5 py-0.5 rounded-full">{data.members.find((m) => m.id === p.ownerId)?.name || "?"}</span>
                    : <span className="text-[9px] uppercase tracking-wide bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded-full">shared</span>}
                </div>
                <div className={`font-mono text-sm tabular-nums ${p.balance < 0 ? "text-rose-600" : "text-stone-500"}`}>

                </div>
              </div>
              <button
                onClick={() => setAdjusting(p.id)}

                <Trash2 size={14} />

        {places.length === 0 && (
          <p className="text-center text-sm text-stone-400 py-8">

        )}

        <Modal title="New place" onClose={() => setShowNew(false)}>

      )}

      {adjustingPlace && (
        <Modal title={`Adjust — ${adjustingPlace.name}`} onClose={() => setAdjusting(null)}>
          <AdjustPlaceForm
            currentBalance={adjustingPlace.balance}
            onSave={(delta) => { onAdjustPlace(adjusting, delta); setAdjusting(null); }}

          <input

        </button>

}

// Settlement helpers shared across debt views.
function debtPaidFrom(debtId, transactions) {
  return transactions.filter((t) => t.debtId === debtId).reduce((s, t) => s + t.amount, 0);
}
function isDebtSettled(d, transactions) {
  if (d.internal) return !!d.settled;
  return d.totalAmount > 0 && debtPaidFrom(d.id, transactions) >= d.totalAmount;
}
function debtSettledDate(d, transactions) {
  if (d.internal) return d.settledDate || "";
  const dates = transactions.filter((t) => t.debtId === d.id).map((t) => t.date).sort();
  return dates.length ? dates[dates.length - 1] : "";
}
const shortDate = (iso) =>
  iso ? new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";

function DebtsTab({ data, paidOnDebt, onAdd, onPay, onDelete, onSettle, onReopen }) {
  const [showSettled, setShowSettled] = useState(true);
  const txs = data.transactions;
  const settled = (d) => isDebtSettled(d, txs);

  const owedActive = data.debts.filter((d) => d.direction === "owed_to_me" && !settled(d));
  const oweActive = data.debts.filter((d) => d.direction === "i_owe" && !settled(d));
  const completed = data.debts
    .filter((d) => settled(d))
    .sort((a, b) => debtSettledDate(b, txs).localeCompare(debtSettledDate(a, txs)));

  return (
    <div className="space-y-5">
      <button onClick={onAdd} className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm flex items-center justify-center gap-1.5">
        <Plus size={15} /> Add a debt
      </button>

      <DebtGroup title="Owed to you" tone="emerald" debts={owedActive} paidOnDebt={paidOnDebt} onPay={onPay} onDelete={onDelete} onSettle={onSettle} />
      <DebtGroup title="You owe" tone="rose" debts={oweActive} paidOnDebt={paidOnDebt} onPay={onPay} onDelete={onDelete} onSettle={onSettle} />

      {completed.length > 0 && (
        <div>
          <button
            type="button"
            onClick={() => setShowSettled((s) => !s)}
            className="w-full flex items-center justify-between mb-2 group"
          >
            <h3 className="font-serif text-base text-stone-500">Settled &amp; completed ({completed.length})</h3>
            <ChevronDown size={18} className={`text-stone-400 transition-transform ${showSettled ? "rotate-180" : ""}`} />
          </button>
          {showSettled && (
            <div className="space-y-2.5">
              {completed.map((d) => (
                <SettledDebtCard
                  key={d.id}
                  debt={d}
                  paid={paidOnDebt(d.id)}
                  settledOn={debtSettledDate(d, txs)}
                  onDelete={onDelete}
                  onReopen={onReopen}
                />
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function PayDebtModal({ debt, data, incomeMembers, paidSoFar, onClose, onSave }) {
  const remaining = debt.totalAmount - paidSoFar;
  const [amount, setAmount] = useState(remaining);
  const [memberId, setMemberId] = useState(incomeMembers[0]?.id || "");
  const [splitMode, setSplitMode] = useState("single");

  const buildPaidFrom = () => {
    if (debt.direction !== "i_owe") return [];
    if (splitMode === "equal") {
      const each = Math.round((amount / incomeMembers.length) * 100) / 100;
      return incomeMembers.map((m) => ({ memberId: m.id, amount: each }));
    }
    return [{ memberId, amount: Number(amount) }];
  };

  return (
    <Modal title={`Record payment · ${debt.personName}`} onClose={onClose}>
      <Field label="Amount">
        <input type="number" className={inputCls} value={amount} onChange={(e) => setAmount(e.target.value)} />
      </Field>
      {debt.direction === "i_owe" ? (
        <Field label="Paid from">
          <div className="flex gap-2 mb-2">
            <Pill active={splitMode === "single"} onClick={() => setSplitMode("single")}>One member</Pill>
            <Pill active={splitMode === "equal"} onClick={() => setSplitMode("equal")}>Split equally</Pill>
          </div>
          {splitMode === "single" && (
            <select className={inputCls} value={memberId} onChange={(e) => setMemberId(e.target.value)}>
              {incomeMembers.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          )}
        </Field>
      ) : (
        <Field label="Received by">
          <select className={inputCls} value={memberId} onChange={(e) => setMemberId(e.target.value)}>
            {incomeMembers.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </Field>
      )}
      <button
        disabled={!amount}
        onClick={() =>
          onSave({
            type: debt.direction === "i_owe" ? "expense" : "income",
            amount: Number(amount),
            categoryId: "debt",
            memberId: debt.direction === "i_owe" ? null : memberId,
            date: todayISO(),
            note: `Payment · ${debt.personName}`,
            paidFrom: buildPaidFrom(),
            debtId: debt.id,
          })
        }
        className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40"
      >
        Save payment
      </button>
    </Modal>
  );
}

            <div className="flex-1 min-w-0">
              <input
                className="text-sm font-medium bg-transparent border-none focus:outline-none w-full"
                defaultValue={m.name}
                onBlur={(e) => onUpdate(m.id, { name: e.target.value })}
              />
              <label className="flex items-center gap-1.5 text-[11px] text-stone-400 mt-0.5">
                <input type="checkbox" checked={m.isIncomeSource} onChange={(e) => onUpdate(m.id, { isIncomeSource: e.target.checked })} />
                Income source (paisa kamata hai)
              </label>
            </div>
            <button onClick={() => onDelete(m.id)} className="text-stone-300 hover:text-rose-600 p-1"><Trash2 size={14} /></button>
          </div>
        ))}
      </div>

      <h4 className="text-xs font-semibold text-stone-500 uppercase tracking-wide mb-2">Add new member</h4>
      <Field label="Name">
        <input className={inputCls} value={name} onChange={(e) => setName(e.target.value)} placeholder="e.g. Dadi" />
      </Field>
      <Field label="Avatar">
        <div className="flex flex-wrap gap-2">
          {AVATAR_CHOICES.map((a) => (
            <button key={a} onClick={() => setAvatar(a)} className={`w-9 h-9 rounded-full flex items-center justify-center text-lg bg-stone-100 ${avatar === a ? "ring-2 ring-amber-500" : ""}`}>{a}</button>
          ))}
        </div>
      </Field>
      <Field label="Color tag">
        <div className="flex flex-wrap gap-2">
          {COLOR_CHOICES.map((c) => (
            <button key={c} onClick={() => setColor(c)} className="w-7 h-7 rounded-full border-2" style={{ backgroundColor: c, borderColor: c === color ? "#1e293b" : "transparent" }} />
          ))}
        </div>
      </Field>
      <label className="flex items-center gap-2 text-sm mb-4">
        <input type="checkbox" checked={isIncomeSource} onChange={(e) => setIsIncomeSource(e.target.checked)} />
        This member earns income (salary source)
      </label>
      <button
        disabled={!name}
        onClick={() => { onAdd({ name, isIncomeSource, avatar, color, sharedWith: [] }); setName(""); }}
        className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40"
      >
        Add member
      </button>
    </Modal>
  );
}

/* ---------------------------------- Add Transaction Modal ---------------------------------- */

function AddTransactionModal({ type, editingTx, data, incomeMembers, onClose, onSave, onUpdate, onAddCategory }) {
  const editing = editingTx || null;
  // Work out the split mode/values from an existing transaction's paidFrom.
  const derivedSplit = (() => {
    const pf = editing?.paidFrom || [];
    const emptyCustom = Object.fromEntries(incomeMembers.map((m) => [m.id, ""]));
    if (pf.length === 0) return { mode: "equal", single: incomeMembers[0]?.id || "", custom: emptyCustom };
    if (pf.length === 1) return { mode: "single", single: pf[0].memberId, custom: emptyCustom };
    const allEqual = pf.every((p) => Math.abs(p.amount - pf[0].amount) < 0.01);
    if (allEqual && pf.length === incomeMembers.length) return { mode: "equal", single: incomeMembers[0]?.id || "", custom: emptyCustom };
    return {
      mode: "custom",
      single: incomeMembers[0]?.id || "",
      custom: Object.fromEntries(incomeMembers.map((m) => [m.id, String(pf.find((x) => x.memberId === m.id)?.amount ?? "")])),
    };
  })();

  const [amount, setAmount] = useState(editing ? String(editing.amount) : "");
  const [categoryId, setCategoryId] = useState(editing?.categoryId || data.categories.find((c) => !c.isSystem)?.id || "");
  const [showNewCategory, setShowNewCategory] = useState(false);
  const [categories, setCategories] = useState(data.categories);

  const handleAddCategory = (c) => {
    const newCat = onAddCategory(c);
    setCategories((prev) => [...prev, newCat]);
    setCategoryId(newCat.id);
    setShowNewCategory(false);
  };
  const [spentBy, setSpentBy] = useState((editing && type === "expense" ? editing.memberId : null) || data.members[0]?.id || "");
  const [incomeSource, setIncomeSource] = useState((editing && type === "income" ? editing.memberId : null) || incomeMembers[0]?.id || "");
  const [placeId, setPlaceId] = useState(editing?.placeId || "");
  const [date, setDate] = useState(editing?.date || todayISO());
  const [note, setNote] = useState(editing?.note || "");
  const [splitMode, setSplitMode] = useState(derivedSplit.mode);
  const [singlePayer, setSinglePayer] = useState(derivedSplit.single);
  const [customSplit, setCustomSplit] = useState(derivedSplit.custom);

  // Family IOU: person A paid now, person B repays A later (add mode only).
  const [isLoan, setIsLoan] = useState(false);
  const [lenderId, setLenderId] = useState(data.members[0]?.id || "");
  const [borrowerId, setBorrowerId] = useState(data.members[1]?.id || data.members[0]?.id || "");
  const [owedAmount, setOwedAmount] = useState("");

  const amt = Number(amount) || 0;

  const buildPaidFrom = () => {
    if (splitMode === "equal") {
      const each = Math.round((amt / incomeMembers.length) * 100) / 100;
      return incomeMembers.map((m) => ({ memberId: m.id, amount: each }));
    }
    if (splitMode === "single") return [{ memberId: singlePayer, amount: amt }];
    return incomeMembers.filter((m) => Number(customSplit[m.id]) > 0).map((m) => ({ memberId: m.id, amount: Number(customSplit[m.id]) }));
  };

  const customSum = Object.values(customSplit).reduce((s, v) => s + (Number(v) || 0), 0);

  return (
    <Modal title={editing ? (type === "income" ? "Edit income" : "Edit expense") : (type === "income" ? "Add income" : "Add expense")} onClose={onClose}>
      <Field label="Amount">
        <input type="number" className={inputCls} value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="0" autoFocus />
      </Field>

      {type === "expense" && (
        <Field label="Category">
          <div className="flex items-center gap-2">
            <select className={inputCls} value={categoryId} onChange={(e) => setCategoryId(e.target.value)}>
              {categories.filter((c) => !c.isSystem).map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
            <button
              type="button"
              onClick={() => setShowNewCategory((v) => !v)}
              className="shrink-0 text-xs font-semibold text-indigo-950 bg-amber-400 px-3 py-2.5 rounded-lg flex items-center gap-1"
            >
              <Plus size={13} /> New
            </button>
          </div>
          {showNewCategory && (
            <div className="mt-2 p-3 rounded-xl bg-stone-50 border border-stone-200">
              <NewCategoryForm onSave={handleAddCategory} compact />
            </div>
          )}
        </Field>
      )}

      {type === "expense" ? (
        <Field label="Spent by">
          <select className={inputCls} value={spentBy} onChange={(e) => setSpentBy(e.target.value)}>
            {data.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </Field>
      ) : (
        <Field label="Income source">
          <select className={inputCls} value={incomeSource} onChange={(e) => setIncomeSource(e.target.value)}>
            {incomeMembers.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
          </select>
        </Field>
      )}

      {type === "expense" && (
        <Field label="Paid from whose money">
          <div className="flex gap-2 mb-2 flex-wrap">
            <Pill active={splitMode === "equal"} onClick={() => setSplitMode("equal")}>Split equally</Pill>
            <Pill active={splitMode === "single"} onClick={() => setSplitMode("single")}>One person</Pill>
            <Pill active={splitMode === "custom"} onClick={() => setSplitMode("custom")}>Custom split</Pill>
          </div>
          {splitMode === "single" && (
            <select className={inputCls} value={singlePayer} onChange={(e) => setSinglePayer(e.target.value)}>
              {incomeMembers.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
            </select>
          )}
          {splitMode === "custom" && (
            <div className="space-y-2">
              {incomeMembers.map((m) => (
                <div key={m.id} className="flex items-center gap-2">
                  <span className="text-xs w-20 truncate">{m.name}</span>
                  <input
                    type="number"
                    className={inputCls}
                    value={customSplit[m.id]}
                    onChange={(e) => setCustomSplit({ ...customSplit, [m.id]: e.target.value })}
                  />
                </div>
              ))}
              <div className={`text-[11px] ${customSum !== amt ? "text-rose-600" : "text-emerald-600"}`}>
                {fmt(customSum)} of {fmt(amt)} allocated
              </div>
            </div>
          )}
          {splitMode === "equal" && incomeMembers.length > 0 && (
            <p className="text-[11px] text-stone-400">
              {fmt(amt / incomeMembers.length || 0)} each from {incomeMembers.map((m) => m.name).join(", ")}
            </p>
          )}
        </Field>
      )}

      {type === "expense" && !editing && data.members.length >= 2 && (
        <Field label="Will someone repay you? (family IOU)">
          <div className="flex gap-2 mb-2">
            <Pill active={!isLoan} onClick={() => setIsLoan(false)}>No</Pill>
            <Pill active={isLoan} onClick={() => setIsLoan(true)}>Yes, someone owes it back</Pill>
          </div>
          {isLoan && (
            <div className="space-y-2.5 p-3 rounded-xl bg-stone-50 border border-stone-200">
              <div>
                <label className="block text-[11px] font-medium text-stone-500 mb-1">Paid now by (will be repaid)</label>
                <select className={inputCls} value={lenderId} onChange={(e) => setLenderId(e.target.value)}>
                  {data.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-stone-500 mb-1">Will repay (owes the money)</label>
                <select className={inputCls} value={borrowerId} onChange={(e) => setBorrowerId(e.target.value)}>
                  {data.members.map((m) => <option key={m.id} value={m.id}>{m.name}</option>)}
                </select>
              </div>
              <div>
                <label className="block text-[11px] font-medium text-stone-500 mb-1">Amount owed</label>
                <input type="number" className={inputCls} value={owedAmount} onChange={(e) => setOwedAmount(e.target.value)} placeholder={`Full amount (${fmt(amt)})`} />
              </div>
              {lenderId === borrowerId ? (
                <p className="text-[11px] text-rose-600">Payer and the person who owes must be different.</p>
              ) : (
                <p className="text-[11px] text-stone-400">
                  {(data.members.find((m) => m.id === borrowerId)?.name) || "?"} will owe {(data.members.find((m) => m.id === lenderId)?.name) || "?"} {fmt(Number(owedAmount) || amt)}. This shows up in the Debts tab.
                </p>
              )}
            </div>
          )}
        </Field>
      )}

      {(data.places || []).length > 0 && (
        <Field label={type === "income" ? "Add to which place?" : "Spend from which place?"}>
          <select className={inputCls} value={placeId} onChange={(e) => setPlaceId(e.target.value)}>
            <option value="">Don't track against a place</option>
            {data.places.map((p) => {
              const owner = data.members.find((m) => m.id === p.ownerId);
              return <option key={p.id} value={p.id}>{p.name}{owner ? ` · ${owner.name}` : " · Shared"} ({fmt(p.balance)})</option>;
            })}
          </select>
        </Field>
      )}

      <Field label="Date">
        <input type="date" className={inputCls} value={date} onChange={(e) => setDate(e.target.value)} />
      </Field>
      <Field label="Note">
        <input className={inputCls} value={note} onChange={(e) => setNote(e.target.value)} placeholder="Optional" />
      </Field>

      <button
        disabled={!amt || (type === "expense" && splitMode === "custom" && customSum !== amt) || (type === "expense" && incomeMembers.length === 0) || (type === "expense" && !editing && isLoan && lenderId === borrowerId)}
        onClick={() => {
          const payload = {
            type, amount: amt, categoryId: type === "expense" ? categoryId : null,
            memberId: type === "expense" ? spentBy : incomeSource,
            date, note, paidFrom: type === "expense" ? buildPaidFrom() : [],
            placeId: placeId || null,
          };
          if (editing) {
            onUpdate(editing.id, payload); // debtId/recurringId preserved from the original
          } else {
            const loan =
              type === "expense" && isLoan && lenderId && borrowerId && lenderId !== borrowerId
                ? {
                    lenderId,
                    borrowerId,
                    amount: Number(owedAmount) || amt,
                    label: data.categories.find((c) => c.id === categoryId)?.name || "",
                  }
                : null;
            onSave({ ...payload, debtId: null, recurringId: null }, loan);
          }
        }}
        className="w-full bg-indigo-950 text-amber-50 rounded-xl py-2.5 font-semibold text-sm disabled:opacity-40 mt-1"
      >
        {editing ? "Save changes" : `Save ${type === "income" ? "income" : "expense"}`}
      </button>
      {type === "expense" && incomeMembers.length === 0 && (
        <p className="text-xs text-rose-600 mt-2">Pehle kam se kam ek income-source member add karein (top-right avatars → Manage members).</p>
      )}
    </Modal>
  );
}

import ReactDOM from "react-dom/client";
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
