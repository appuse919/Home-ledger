function hexToRgb(hex) {
  const h = hex.replace("#", "");
  return { r: parseInt(h.slice(0, 2), 16), g: parseInt(h.slice(2, 4), 16), b: parseInt(h.slice(4, 6), 16) };
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map((v) => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0")).join("");
}
function mixHex(hex1, hex2, weight) {
  const c1 = hexToRgb(hex1), c2 = hexToRgb(hex2);
  return rgbToHex(c1.r + (c2.r - c1.r) * weight, c1.g + (c2.g - c1.g) * weight, c1.b + (c2.b - c1.b) * weight);
}

  function friendlyError(code) {
    if (code === "auth/email-already-in-use") return "That email already has an account — try signing in instead.";
    if (code === "auth/invalid-email") return "That doesn't look like a valid email address.";
    if (code === "auth/weak-password") return "Password should be at least 6 characters.";
    if (code === "auth/wrong-password" || code === "auth/invalid-credential") return "Wrong email or password.";
    if (code === "auth/user-not-found") return "No account with that email — try signing up instead.";
    if (code === "auth/too-many-requests") return "Too many attempts — please wait a moment and try again.";
    return "Something went wrong. Please try again.";

export default function App() {
  const [authUser, setAuthUser] = useState(null);
  const [authChecked, setAuthChecked] = useState(false);
  const [allowlist, setAllowlist] = useState(undefined); // undefined = checking, null = doesn't exist yet
  const [bootstrapping, setBootstrapping] = useState(false);
  const [requests, setRequests] = useState([]);

  useEffect(() => {
    const unsub = onAuthStateChanged(auth, (u) => {
      setAuthUser(u);
      setAuthChecked(true);
      if (!u) setAllowlist(undefined);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!authUser) return;
    const unsub = onSnapshot(allowlistRef, (snap) => {
      setAllowlist(snap.exists() ? snap.data() : null);
    });
    return unsub;
  }, [authUser]);

  useEffect(() => {
    (async () => {
      if (!authUser || allowlist !== null || bootstrapping) return;
      setBootstrapping(true);
      try {
        const snap = await getDoc(allowlistRef);
        if (!snap.exists()) {
          await setDoc(allowlistRef, {
            ownerUid: authUser.uid,
            approvedUids: [authUser.uid],
            emails: { [authUser.uid]: authUser.email || "" },
          });
          await setDoc(ledgerRef, seedData());
        }
      } catch (e) {
        // ignore; onSnapshot above will retry state on next change
      }
      setBootstrapping(false);
    })();
  }, [authUser, allowlist, bootstrapping]);

  const isApproved = !!(authUser && allowlist && allowlist.approvedUids?.includes(authUser.uid));
  const isOwner = !!(authUser && allowlist && allowlist.ownerUid === authUser.uid);

  useEffect(() => {
    (async () => {
      if (!authUser || !allowlist || isApproved) return;
      try {
        await setDoc(doc(db, "requests", authUser.uid), { email: authUser.email || "", requestedAt: Date.now() }, { merge: true });
      } catch (e) {}
    })();
  }, [authUser, allowlist, isApproved]);

  useEffect(() => {
    if (!isOwner) { setRequests([]); return; }
    const unsub = onSnapshot(requestsCol, (snap) => {
      setRequests(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return unsub;
  }, [isOwner]);

  async function approveRequest(uid, email) {
    await updateDoc(allowlistRef, {
      approvedUids: arrayUnion(uid),
      [`emails.${uid}`]: email || "",
    });
    await deleteDoc(doc(db, "requests", uid));
  }
  async function denyRequest(uid) {
    await deleteDoc(doc(db, "requests", uid));
  }
  async function transferOwnership(uid) {
    await updateDoc(allowlistRef, { ownerUid: uid });
  }
  function handleSignOut() {
    signOut(auth);
  }

  if (!authChecked) return <FullScreenLoader label="Loading…" />;
  if (!authUser) return <AuthScreen />;
  if (allowlist === undefined || bootstrapping) return <FullScreenLoader label="Setting things up…" />;
  if (!isApproved) return <PendingScreen email={authUser.email} onSignOut={handleSignOut} />;

  return (
    <Ledger
      user={authUser}
      isOwner={isOwner}
      requests={requests}
      allowlist={allowlist}
      onApprove={approveRequest}
      onDeny={denyRequest}
      onSignOut={handleSignOut}
      onTransferOwner={transferOwnership}
    />
  );
}

function Ledger({ user, isOwner, requests, allowlist, onApprove, onDeny, onSignOut, onTransferOwner }) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [viewMode, setViewMode] = useState("family");
  const [lang, setLang] = useState("en");
  const t = (key) => TRANSLATIONS[key]?.[lang] || TRANSLATIONS[key]?.en || key;
  const [showAddTx, setShowAddTx] = useState(null);
  const [showImport, setShowImport] = useState(false);
  const [editTx, setEditTx] = useState(null);
  const [showMembers, setShowMembers] = useState(false);
  const [showRecurringModal, setShowRecurringModal] = useState(false);
  const [showAddRecurring, setShowAddRecurring] = useState(false);
  const [showAddDebt, setShowAddDebt] = useState(false);
  const [payDebt, setPayDebt] = useState(null);
  const [filters, setFilters] = useState({ q: "", category: "all", member: "all", from: "", to: "" });
  const [incomeFilters, setIncomeFilters] = useState({ q: "", category: "all", member: "all", from: "", to: "" });

  const goToCategory = (categoryId) => {
    setFilters({ q: "", category: categoryId, member: viewMode === "family" ? "all" : viewMode, from: "", to: "" });
    setTab("transactions");
  };

  useEffect(() => {
    let seeding = false;
    const unsub = onSnapshot(
      ledgerRef,
      async (snap) => {
        if (snap.exists()) {
          setData(snap.data());
          setLoading(false);
        } else if (isOwner && !seeding) {
          seeding = true;
          const seed = seedData();
          try {
            await setDoc(ledgerRef, seed);
          } catch (e) {}
        } else {
          setLoading(false);
        }
      },
      () => setLoading(false)
    );
    return unsub;
  }, [isOwner]);

  useEffect(() => {
    if (data && viewMode !== "family" && !data.members.some((m) => m.id === viewMode)) {
      setViewMode("family");
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data, viewMode]);

  // Tapping a person at the top filters the Transactions and Income lists to that person.
  useEffect(() => {
    const m = viewMode === "family" ? "all" : viewMode;
    setFilters((f) => ({ ...f, member: m }));
    setIncomeFilters((f) => ({ ...f, member: m }));
  }, [viewMode]);

  async function persist(rawNext) {
    // Record when each entry was added / last modified, and when the ledger last changed.
    const now = new Date().toISOString();
    const prev = new Map(((data && data.transactions) || []).map((t) => [t.id, t]));
    const next = { ...rawNext, lastModified: now };
    if (rawNext.transactions) {
      next.transactions = rawNext.transactions.map((t) => {
        const old = prev.get(t.id);
        if (!old) return t.createdAt ? t : { ...t, createdAt: now, updatedAt: now };
        return old === t ? t : { ...t, updatedAt: now };
      });
    }
    setData(next);
    try {
      await setDoc(ledgerRef, next);
      setSaveError(false);
    } catch (e) {
      setSaveError(true);
    }
  }

  /* ---------- mutators ---------- */
  const addTransaction = (tx) => {
    const newTx = { id: uid("t"), ...tx };
    let places = data.places || [];
    if (newTx.placeId) {
      const delta = newTx.type === "income" ? newTx.amount : -newTx.amount;
      places = places.map((p) => (p.id === newTx.placeId ? { ...p, balance: (p.balance || 0) + delta } : p));
    }
    let allowances = data.allowances || [];
    if (newTx.allowanceId) {
      allowances = allowances.map((a) => (a.id === newTx.allowanceId ? { ...a, balance: (a.balance || 0) - newTx.amount } : a));
    }
    persist({ ...data, transactions: [newTx, ...data.transactions], places, allowances });
  };
  const importTransactions = (txs, rules) => {
    persist({ ...data, transactions: [...txs.map((x) => ({ id: uid("t"), ...x })), ...data.transactions], merchantRules: { ...(data.merchantRules || {}), ...rules } });
    setShowImport(false);
  };
  // Adds an expense and, optionally, a family IOU debt (member B owes member A)
  // in a single save so both land together.
  const addTransactionWithDebt = (tx, loan) => {
    const newTx = { id: uid("t"), ...tx };
    let places = data.places || [];
    if (newTx.placeId) {
      const delta = newTx.type === "income" ? newTx.amount : -newTx.amount;
      places = places.map((p) => (p.id === newTx.placeId ? { ...p, balance: (p.balance || 0) + delta } : p));
    }
    let allowances = data.allowances || [];
    if (newTx.allowanceId) {
      allowances = allowances.map((a) => (a.id === newTx.allowanceId ? { ...a, balance: (a.balance || 0) - newTx.amount } : a));
    }
    let debts = data.debts;
    if (loan && loan.amount > 0 && loan.lenderId && loan.borrowerId && loan.lenderId !== loan.borrowerId) {
      const lender = data.members.find((m) => m.id === loan.lenderId);
      const borrower = data.members.find((m) => m.id === loan.borrowerId);
      debts = [
        ...debts,
        {
          id: uid("d"),
          personName: `${borrower?.name || "?"} → ${lender?.name || "?"}`,
          direction: "owed_to_me",
          internal: true,
          fromMember: loan.borrowerId,
          toMember: loan.lenderId,
          totalAmount: loan.amount,
          dueDate: "",
          note: newTx.note || loan.label || "",
        },
      ];
    }
    persist({ ...data, transactions: [newTx, ...data.transactions], places, allowances, debts });
  };
  const deleteTransaction = (id) => {
    const tx = data.transactions.find((t) => t.id === id);
    let places = data.places || [];
    if (tx && tx.placeId) {
      const delta = tx.type === "income" ? -tx.amount : tx.amount;
      places = places.map((p) => (p.id === tx.placeId ? { ...p, balance: (p.balance || 0) + delta } : p));
    }
    let allowances = data.allowances || [];
    if (tx && tx.allowanceId) {
      allowances = allowances.map((a) => (a.id === tx.allowanceId ? { ...a, balance: (a.balance || 0) + tx.amount } : a));
    }
    persist({ ...data, transactions: data.transactions.filter((t) => t.id !== id), places, allowances });
  };
  const updateTransaction = (id, patch) => {
    const old = data.transactions.find((t) => t.id === id);
    if (!old) return;
    const updated = { ...old, ...patch };
    let places = data.places || [];
    // 1) reverse the old transaction's effect on its place
    if (old.placeId) {
      const revert = old.type === "income" ? -old.amount : old.amount;
      places = places.map((p) => (p.id === old.placeId ? { ...p, balance: (p.balance || 0) + revert } : p));
    }
    // 2) apply the updated transaction's effect on its (possibly new) place
    if (updated.placeId) {
      const apply = updated.type === "income" ? updated.amount : -updated.amount;
      places = places.map((p) => (p.id === updated.placeId ? { ...p, balance: (p.balance || 0) + apply } : p));
    }
    let allowances = data.allowances || [];
    if (old.allowanceId) {
      allowances = allowances.map((a) => (a.id === old.allowanceId ? { ...a, balance: (a.balance || 0) + old.amount } : a));
    }
    if (updated.allowanceId) {
      allowances = allowances.map((a) => (a.id === updated.allowanceId ? { ...a, balance: (a.balance || 0) - updated.amount } : a));
    }
    persist({ ...data, transactions: data.transactions.map((t) => (t.id === id ? updated : t)), places, allowances });
  };
  const addPlace = (p) => persist({ ...data, places: [...(data.places || []), { id: uid("pl"), ...p }] });
  const updatePlace = (id, patch) => persist({ ...data, places: (data.places || []).map((p) => (p.id === id ? { ...p, ...patch } : p)) });
  const deletePlace = (id) =>
    persist({
      ...data,
      places: (data.places || []).filter((p) => p.id !== id),
      transactions: data.transactions.map((t) => (t.placeId === id ? { ...t, placeId: null } : t)),
    });
  const adjustPlace = (id, delta) =>
    persist({ ...data, places: (data.places || []).map((p) => (p.id === id ? { ...p, balance: (p.balance || 0) + delta } : p)) });
  const addAllowance = (a) => persist({ ...data, allowances: [...(data.allowances || []), { id: uid("al"), ...a }] });
  const updateAllowance = (id, patch) =>
    persist({ ...data, allowances: (data.allowances || []).map((a) => (a.id === id ? { ...a, ...patch } : a)) });
  const deleteAllowance = (id) =>
    persist({
      ...data,
      allowances: (data.allowances || []).filter((a) => a.id !== id),
      transactions: data.transactions.map((t) => (t.allowanceId === id ? { ...t, allowanceId: null } : t)),
    });
  const adjustAllowance = (id, delta) =>
    persist({ ...data, allowances: (data.allowances || []).map((a) => (a.id === id ? { ...a, balance: (a.balance || 0) + delta } : a)) });
  const addMember = (m) => persist({ ...data, members: [...data.members, { id: uid("m"), ...m }] });
  const updateMember = (id, patch) => persist({ ...data, members: data.members.map((m) => (m.id === id ? { ...m, ...patch } : m)) });
  const deleteMember = (id) => persist({ ...data, members: data.members.filter((m) => m.id !== id) });
  const updateCategory = (id, patch) => persist({ ...data, categories: data.categories.map((c) => (c.id === id ? { ...c, ...patch } : c)) });
  const addCategory = (c) => {
    const newCat = { id: uid("cat"), ...c };
    persist({ ...data, categories: [...data.categories, newCat] });
    return newCat;
  };
  const deleteCategory = (id) => persist({ ...data, categories: data.categories.filter((c) => c.id !== id) });
  const addDebt = (d) => persist({ ...data, debts: [...data.debts, { id: uid("d"), ...d }] });
  const deleteDebt = (id) => persist({ ...data, debts: data.debts.filter((d) => d.id !== id), transactions: data.transactions.filter((t) => t.debtId !== id) });
  const settleDebt = (id) => persist({ ...data, debts: data.debts.map((d) => (d.id === id ? { ...d, settled: true, settledDate: todayISO() } : d)) });
  const reopenDebt = (id) => persist({ ...data, debts: data.debts.map((d) => (d.id === id ? { ...d, settled: false, settledDate: "" } : d)) });
  const addRecurring = (r) => persist({ ...data, recurring: [...data.recurring, { id: uid("r"), ...r }] });
  const toggleRecurring = (id) => persist({ ...data, recurring: data.recurring.map((r) => (r.id === id ? { ...r, active: !r.active } : r)) });
  const deleteRecurring = (id) => persist({ ...data, recurring: data.recurring.filter((r) => r.id !== id) });
  const updateSettings = (patch) => persist({ ...data, settings: { ...data.settings, ...patch } });

  const applyRecurring = (r) => {
    const paidFrom =
      r.type === "expense"
        ? splitEqually(r.amount, data.members.map((m) => m.id))
        : [];
    const date = `${thisMonthKey()}-${String(r.dayOfMonth || 1).padStart(2, "0")}`;
    addTransaction({
      type: r.type, amount: r.amount, categoryId: r.categoryId, memberId: r.memberId,
      date, note: r.note, paidFrom, recurringId: r.id, debtId: null,
    });
  };

  const resetDemo = () => persist(seedData());
  const clearAll = () => persist({ members: [], categories: DEFAULT_CATEGORIES, transactions: [], debts: [], recurring: [], recurringLog: {}, settings: { overallBudget: 0 } });

  /* ---------- derived ---------- */
  const incomeMembers = useMemo(() => (data ? data.members.filter((m) => m.isIncomeSource) : []), [data]);

  const currentMonthTx = useMemo(
    () => (data ? data.transactions.filter((t) => monthKeyOf(t.date) === thisMonthKey()) : []),
    [data]
  );

  const categorySpendThisMonth = (catId) =>
    currentMonthTx.filter((t) => t.type === "expense" && t.categoryId === catId).reduce((s, t) => s + t.amount, 0);

  const familyTotals = useMemo(() => {
    if (!data) return { income: 0, expense: 0 };
    const income = currentMonthTx.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
    const expense = currentMonthTx.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
    return { income, expense };
  }, [currentMonthTx, data]);

  const netWorth = useMemo(() => {
    if (!data) return 0;
    const allIncome = data.transactions.filter((t) => t.type === "income").reduce((s, t) => s + t.amount, 0);
    const allExpense = data.transactions.filter((t) => t.type === "expense").reduce((s, t) => s + t.amount, 0);
    const cash = allIncome - allExpense;
    const owedToMe = data.debts.filter((d) => d.direction === "owed_to_me" && !d.internal).reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
    const iOwe = data.debts.filter((d) => d.direction === "i_owe" && !d.internal).reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
    return cash + owedToMe - iOwe;
  }, [data]);

  function paidOnDebt(debtId) {
    return data.transactions.filter((t) => t.debtId === debtId).reduce((s, t) => s + t.amount, 0);
  }

  const memberBalance = (memberId) => {
    const income = data.transactions.filter((t) => t.type === "income" && t.memberId === memberId).reduce((s, t) => s + t.amount, 0);
    const funded = data.transactions
      .filter((t) => t.type === "expense")
      .reduce((s, t) => s + (t.paidFrom || []).filter((p) => p.memberId === memberId).reduce((x, p) => x + p.amount, 0), 0);
    return income - funded;
  };
  const memberIncomeThisMonth = (memberId) =>
    currentMonthTx.filter((t) => t.type === "income" && t.memberId === memberId).reduce((s, t) => s + t.amount, 0);
  const memberFundedThisMonth = (memberId) =>
    currentMonthTx
      .filter((t) => t.type === "expense")
      .reduce((s, t) => s + (t.paidFrom || []).filter((p) => p.memberId === memberId).reduce((x, p) => x + p.amount, 0), 0);
  const memberSpentThisMonth = (memberId) =>
    currentMonthTx.filter((t) => t.type === "expense" && t.memberId === memberId).reduce((s, t) => s + t.amount, 0);
  const memberCategoryBreakdown = (memberId) =>
    data.categories
      .map((c) => ({
        name: c.name,
        color: c.color,
        value: currentMonthTx.filter((t) => t.type === "expense" && t.memberId === memberId && t.categoryId === c.id).reduce((s, t) => s + t.amount, 0),
      }))
      .filter((d) => d.value > 0);
  const memberOwnTransactions = (memberId) =>
    data.transactions.filter((t) => t.type === "expense" && t.memberId === memberId).sort((a, b) => b.date.localeCompare(a.date)).slice(0, 20);
  const toggleShareWith = (ownerId, targetId) => {
    const owner = data.members.find((m) => m.id === ownerId);
    if (!owner) return;
    const list = owner.sharedWith || [];
    const next = list.includes(targetId) ? list.filter((id) => id !== targetId) : [...list, targetId];
    updateMember(ownerId, { sharedWith: next });
  };

  const pendingRecurring = useMemo(() => {
    if (!data) return [];
    return data.recurring.filter(
      (r) => r.active && !data.transactions.some((t) => t.recurringId === r.id && monthKeyOf(t.date) === thisMonthKey())
    );
  }, [data]);

  /* ---------- reminder notifications ---------- */
  const [notifPermission, setNotifPermission] = useState(
    typeof Notification !== "undefined" ? Notification.permission : "unsupported"
  );

  async function enableReminders() {
    if (typeof Notification === "undefined") return;
    const perm = await Notification.requestPermission();
    setNotifPermission(perm);
  }

  useEffect(() => {
    if (notifPermission !== "granted" || pendingRecurring.length === 0) return;
    const flagKey = "home-ledger-notified-" + thisMonthKey();
    if (localStorage.getItem(flagKey)) return; // already notified this month
    const title = pendingRecurring.length === 1 ? "1 recurring entry pending" : `${pendingRecurring.length} recurring entries pending`;
    const body = pendingRecurring.map((r) => r.note || r.type).slice(0, 3).join(", ") + (pendingRecurring.length > 3 ? "…" : "");
    const show = () => {
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.ready.then((reg) => {
          reg.showNotification(title, { body, icon: "icon-192.png", badge: "icon-192.png" }).catch(() => {
            try { new Notification(title, { body, icon: "icon-192.png" }); } catch (e) {}
          });
        });
      } else {
        try { new Notification(title, { body, icon: "icon-192.png" }); } catch (e) {}
      }
    };
    show();
    localStorage.setItem(flagKey, "1");
  }, [notifPermission, pendingRecurring]);

  const monthlyTrend = useMemo(() => {
    if (!data) return [];
    return buildTrendSeries(
      data.transactions, data.categories,
      (d) => monthKeyOf(d),
      (k) => monthLabel(k),
      (k) => monthLabel(k),
    ).slice(-6);
  }, [data]);

  const yearlyTrend = useMemo(() => {
    if (!data) return [];
    return buildTrendSeries(
      data.transactions, data.categories,
      (d) => (d || "").slice(0, 4),
      (k) => k,
      (k) => `Year ${k}`,
    );
  }, [data]);

  const dailyThisMonth = useMemo(() => {
    if (!data) return [];
    const mk = thisMonthKey();
    return buildTrendSeries(
      data.transactions.filter((t) => monthKeyOf(t.date) === mk),
      data.categories,
      (d) => d,
      (k) => new Date(k).toLocaleDateString("en-IN", { day: "numeric", month: "short" }),
      (k) => new Date(k).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" }),
    );
  }, [data]);

  const categoryPie = useMemo(() => {
    if (!data) return [];
    return data.categories
      .map((c) => ({ id: c.id, name: c.name, value: categorySpendThisMonth(c.id), color: c.color }))
      .filter((d) => d.value > 0);
  }, [data, currentMonthTx]);

  // Shared filtering + deep search used by both the Split/Transaction tab
  // (expenses) and the Income tab. `typeWanted` limits to "expense" or "income".
  const runFilter = (f, typeWanted) => {
    if (!data) return [];
    const searchBlob = (t) => {
      const cat = data.categories.find((c) => c.id === t.categoryId);
      const mem = data.members.find((m) => m.id === t.memberId);
      const place = (data.places || []).find((p) => p.id === t.placeId);
      const splitNames = (t.paidFrom || [])
        .map((p) => data.members.find((m) => m.id === p.memberId)?.name)
        .filter(Boolean);
      return [t.note, cat?.name, mem?.name, place?.name, t.type, t.date, String(Math.round(t.amount || 0)), ...splitNames]
        .filter(Boolean)
        .join(" ")
        .toLowerCase();
    };
    // Multiple words must all match: "electricity ramesh" narrows to both.
    const terms = (f.q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
    return data.transactions
      .filter((t) => (typeWanted ? t.type === typeWanted : true))
      .filter((t) => (f.category === "all" ? true : t.categoryId === f.category))
      .filter((t) => (f.member === "all" ? true : t.memberId === f.member))
      .filter((t) => (f.from ? t.date >= f.from : true))
      .filter((t) => (f.to ? t.date <= f.to : true))
      .filter((t) => {
        if (terms.length === 0) return true;
        const blob = searchBlob(t);
        return terms.every((term) => blob.includes(term));
      })
      .sort((a, b) => b.date.localeCompare(a.date));
  };
  // Split / Transaction tab shows expenses only.
  const filteredTx = useMemo(() => runFilter(filters, "expense"), [data, filters]);
  // Income tab shows income only.
  const filteredIncome = useMemo(() => runFilter(incomeFilters, "income"), [data, incomeFilters]);

  function splitEqually(amount, memberIds) {
    if (!memberIds.length) return [];
    const each = Math.floor((amount / memberIds.length) * 100) / 100;
    const rem = Math.round((amount - each * memberIds.length) * 100) / 100;
    return memberIds.map((id, i) => ({ memberId: id, amount: i === 0 ? each + rem : each }));
  }

  function exportCSV() {
    const rows = [["Date", "Type", "Amount", "Category", "Spent By", "Paid From", "Note", "Added On", "Last Modified"]];
    data.transactions.forEach((t) => {
      const cat = data.categories.find((c) => c.id === t.categoryId)?.name || "";
      const member = data.members.find((m) => m.id === t.memberId)?.name || "";
      const paid = (t.paidFrom || []).map((p) => `${data.members.find((m) => m.id === p.memberId)?.name || "?"}:${p.amount}`).join(" | ");
      rows.push([t.date, t.type, t.amount, cat, member, paid, t.note || "", fmtStamp(t.createdAt), fmtStamp(t.updatedAt)]);
    });
    const csv = rows.map((r) => r.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(",")).join("\n");
    downloadBlob(csv, "home-ledger-transactions.csv", "text/csv");
  }
  function exportJSON() {
    downloadBlob(JSON.stringify(data, null, 2), "home-ledger-backup.json", "application/json");
  }
  function downloadBlob(content, filename, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const parsed = JSON.parse(e.target.result);
        if (parsed.members && parsed.transactions) persist(parsed);
      } catch (err) {}
    };
    reader.readAsText(file);
  }

  /* ---------- loading ---------- */
  if (loading || !data) {
    return (
      <div className="min-h-[400px] flex items-center justify-center bg-stone-50 rounded-2xl">
        <div className="flex flex-col items-center gap-3 text-stone-400">
          <RefreshCw className="animate-spin" size={28} />
          <span className="text-sm font-medium">{lang === "mr" ? TRANSLATIONS.loading.mr : TRANSLATIONS.loading.en}</span>
        </div>
      </div>
    );
  }

  const selectedMember = viewMode !== "family" ? data.members.find((m) => m.id === viewMode) : null;

  return (
    <LangContext.Provider value={{ lang, t }}>
    <div className="w-full min-h-screen bg-stone-50 text-stone-800 font-sans">
      {/* header */}
      <div
        className={`px-4 sm:px-6 pt-5 pb-4 rounded-b-2xl transition-colors duration-200 ${selectedMember ? "text-white" : "bg-indigo-950 text-amber-50"}`}
        style={selectedMember ? { background: `linear-gradient(135deg, ${selectedMember.color || "#1e3a5f"}, ${selectedMember.color || "#1e3a5f"}cc)` } : undefined}
      >
        <div className="flex items-center justify-between mb-4">
          <div className="flex items-center gap-2.5">
            {selectedMember ? (
              <Avatar member={selectedMember} size="lg" />
            ) : (
              <div className="w-10 h-10 rounded-full bg-amber-500 flex items-center justify-center text-indigo-950">
                <Stamp size={20} />
              </div>
            )}
            <div>
              <h1 className="font-serif text-base sm:text-xl leading-tight flex items-center gap-1.5">
                {selectedMember ? selectedMember.name : t("appName")}
              </h1>
              <p className={`text-xs tracking-wide flex items-center gap-1 ${selectedMember ? "text-white/75" : "text-indigo-300"}`}>
                {selectedMember ? (<><User size={11} /> Viewing personal data</>) : (<><Users size={11} /> {t("tagline")}</>)}
              </p>
            </div>
          </div>
          <div className="flex items-center gap-3">
            <button
              onClick={() => setLang(lang === "en" ? "mr" : "en")}
              className={`text-xs font-semibold rounded-full px-3 py-1.5 ${selectedMember ? "bg-white/15 text-white" : "bg-indigo-800 text-indigo-100"}`}
            >
              {lang === "en" ? "मराठी" : "English"}
            </button>
            <button onClick={() => setShowMembers(true)} className="flex items-center -space-x-2">
              {data.members.slice(0, 4).map((m) => (
                <Avatar key={m.id} member={m} size="sm" />
              ))}
              <div className={`w-7 h-7 rounded-full flex items-center justify-center text-[10px] ml-1 ring-2 ${selectedMember ? "bg-white/15 ring-white/20" : "bg-indigo-800 ring-indigo-950"}`}>
                <SettingsIcon size={12} />
              </div>
            </button>
            <button onClick={onSignOut} title="Sign out" className={`w-8 h-8 rounded-full flex items-center justify-center ${selectedMember ? "bg-white/15 text-white" : "bg-indigo-800 text-indigo-100"}`}>
              <LogOut size={14} />
            </button>
          </div>
        </div>

        {/* family/individual toggle */}
        <div className="flex items-center gap-2 overflow-x-auto pb-1 -mx-1 px-1">
          <Pill active={viewMode === "family"} onClick={() => setViewMode("family")} icon={Users}>
            {t("family")}
          </Pill>
          {data.members.map((m) => (
            <Pill key={m.id} active={viewMode === m.id} onClick={() => setViewMode(m.id)} icon={User} color={m.color}>
              {m.name}
            </Pill>
          ))}
        </div>
      </div>

      {saveError && (
        <div className="mx-4 mt-3 text-sm bg-rose-50 text-rose-700 border border-rose-200 rounded-lg px-3 py-2 flex items-center gap-2">
          <AlertTriangle size={14} /> {t("saveFailed")}
        </div>
      )}

      {/* pending recurring banner */}
      {pendingRecurring.length > 0 && (
        <button
          onClick={() => setShowRecurringModal(true)}
          className="w-full text-left mx-4 mt-3 bg-amber-100 border border-amber-300 text-amber-900 rounded-xl px-4 py-3 flex items-center justify-between gap-2"
          style={{ width: "calc(100% - 2rem)" }}
        >
          <span className="flex items-center gap-2 text-sm font-medium">
            <Repeat size={16} /> {pendingRecurring.length} {t("recurringPending")} {monthLabel(thisMonthKey())}
          </span>
          <span className="text-xs underline">{t("review")}</span>
        </button>
      )}

      {/* tabs */}
      <div className="flex gap-1.5 px-4 mt-4 overflow-x-auto pb-1">
        {[
          ["dashboard", t("dashboard"), LayoutGrid],
          ["transactions", t("transactions"), ListTree],
          ["income", t("income"), TrendingUp],
          ["places", t("places"), Wallet],
          ["gharkharcha", t("gharKharcha"), HandCoins],
          ["budgets", t("budgets"), PiggyBank],
          ["debts", t("debts"), Landmark],
          ["recurring", t("recurring"), Repeat],
          ["settings", t("settings"), SettingsIcon],
        ].map(([id, label, Icon]) => (
          <Pill key={id} active={tab === id} onClick={() => setTab(id)} icon={Icon}>
            {label}
          </Pill>
        ))}
      </div>

      <div className="px-4 py-5 max-w-3xl mx-auto">
        {tab === "dashboard" && (
          <Dashboard
            data={data}
            viewMode={viewMode}
            selectedMember={selectedMember}
            familyTotals={familyTotals}
            netWorth={netWorth}
            memberIncomeThisMonth={memberIncomeThisMonth}
            memberFundedThisMonth={memberFundedThisMonth}
            memberSpentThisMonth={memberSpentThisMonth}
            memberCategoryBreakdown={memberCategoryBreakdown}
            memberOwnTransactions={memberOwnTransactions}
            categoryPie={categoryPie}
            monthlyTrend={monthlyTrend}
            yearlyTrend={yearlyTrend}
            dailyThisMonth={dailyThisMonth}
            categorySpendThisMonth={categorySpendThisMonth}
            onAddTx={(type) => setShowAddTx(type)}
            onCategoryClick={goToCategory}
            onUpdateMember={updateMember}
            onViewAll={() => setTab("transactions")}
          />
        )}

        {tab === "transactions" && (
          <TransactionsTab
            data={data}
            mode="expense"
            filters={filters}
            setFilters={setFilters}
            filteredTx={filteredTx}
            incomeMembers={incomeMembers}
            onDelete={deleteTransaction}
            onEdit={(t) => setEditTx(t)}
            onAdd={(type) => setShowAddTx(type)}
          />
        )}

        {tab === "income" && (
          <TransactionsTab
            data={data}
            mode="income"
            filters={incomeFilters}
            setFilters={setIncomeFilters}
            filteredTx={filteredIncome}
            incomeMembers={incomeMembers}
            onDelete={deleteTransaction}
            onEdit={(t) => setEditTx(t)}
            onAdd={(type) => setShowAddTx(type)}
          />
        )}

        {tab === "places" && (
          <PlacesTab
            data={data}
            viewMode={viewMode}
            selectedMember={selectedMember}
            onAddPlace={addPlace}
            onUpdatePlace={updatePlace}
            onDeletePlace={deletePlace}
            onAdjustPlace={adjustPlace}
          />
        )}

        {tab === "gharkharcha" && (
          <AllowancesTab
            data={data}
            onAdd={addAllowance}
            onUpdate={updateAllowance}
            onDelete={deleteAllowance}
            onAdjust={adjustAllowance}
          />
        )}

        {tab === "budgets" && (
          <BudgetsTab
            data={data}
            categorySpendThisMonth={categorySpendThisMonth}
            familyTotals={familyTotals}
            onUpdateCategory={updateCategory}
            onAddCategory={addCategory}
            onDeleteCategory={deleteCategory}
            onUpdateSettings={updateSettings}
            onCategoryClick={goToCategory}
          />
        )}

        {tab === "debts" && (
          <DebtsTab
            data={data}
            viewMode={viewMode}
            selectedMember={selectedMember}
            paidOnDebt={paidOnDebt}
            onAdd={() => setShowAddDebt(true)}
            onPay={(d) => setPayDebt(d)}
            onDelete={deleteDebt}
            onSettle={settleDebt}
            onReopen={reopenDebt}
          />
        )}

        {tab === "recurring" && (
          <RecurringTab
            data={data}
            viewMode={viewMode}
            selectedMember={selectedMember}
            onAdd={() => setShowAddRecurring(true)}
            onToggle={toggleRecurring}
            onDelete={deleteRecurring}
            onApply={applyRecurring}
            pendingIds={pendingRecurring.map((r) => r.id)}
          />
        )}

        {tab === "settings" && (

      {showRecurringModal && (

                <div key={r.id} className="flex items-center justify-between bg-white border border-stone-200 rounded-xl p-3">
                  <div className="flex items-center gap-3">

                      <div className="text-sm font-medium">{r.note}</div>
                      <div className="text-xs text-stone-400">
                        {r.type === "income" ? "Income" : "Expense"} · {fmt(r.amount)}

                  <button

            {pendingRecurring.length === 0 && <p className="text-sm text-stone-400 text-center py-4">{lang === "mr" ? "सर्व नोंदी झाल्या 🎉" : "All entries added 🎉"}</p>}
          </div>

      {showAddDebt && (
        <AddDebtModal members={data.members} onClose={() => setShowAddDebt(false)} onSave={(d) => { addDebt(d); setShowAddDebt(false); }} />

      {payDebt && (

          onSave={(tx) => {
            addTransaction(tx);
            setPayDebt(null);
          }}

      )}

      {showAddRecurring && (
        <AddRecurringModal

          onSave={(r) => { addRecurring(r); setShowAddRecurring(false); }}

      )}
    </div>
    </LangContext.Provider>
  );
}

// Builds an income/expense series bucketed by keyOf(date), enriched with net,
// transaction count, and the top spending category for that bucket.
function buildTrendSeries(transactions, categories, keyOf, labelOf, titleOf) {
  const catName = (id) => (categories.find((c) => c.id === id) || {}).name || "Other";
  const map = {};
  transactions.forEach((t) => {
    const k = keyOf(t.date);
    if (!k) return;
    if (!map[k]) map[k] = { key: k, income: 0, expense: 0, count: 0, cats: {} };
    const row = map[k];
    row[t.type] += t.amount;
    row.count += 1;
    if (t.type === "expense") {
      const nm = catName(t.categoryId);
      row.cats[nm] = (row.cats[nm] || 0) + t.amount;
    }
  });
  return Object.values(map)
    .sort((a, b) => a.key.localeCompare(b.key))
    .map((r) => {
      const top = Object.entries(r.cats).sort((a, b) => b[1] - a[1])[0];
      return {
        key: r.key,
        income: r.income,
        expense: r.expense,
        count: r.count,
        net: r.income - r.expense,
        topCat: top ? top[0] : null,
        topCatAmount: top ? top[1] : 0,
        label: labelOf(r.key),
        title: (titleOf || labelOf)(r.key),
      };
    });
}

function TrendTooltip({ active, payload }) {
  if (!active || !payload || !payload.length) return null;
  const d = payload[0].payload;
  return (
    <div className="bg-white border border-stone-200 rounded-xl shadow-lg px-3 py-2.5 text-xs min-w-[168px]">
      <div className="font-semibold text-indigo-950 mb-1.5">{d.title}</div>

        <span className="font-mono tabular-nums text-emerald-700">{fmt(d.income)}</span>
      </div>
      <div className="flex items-center justify-between gap-4">

        <span className="font-mono tabular-nums text-rose-700">{fmt(d.expense)}</span>
      </div>
      <div className="flex items-center justify-between gap-4 border-t border-stone-100 mt-1.5 pt-1.5">

          {d.net >= 0 ? "+" : "−"}{fmt(Math.abs(d.net))}

  );

function Dashboard({ onViewAll, data, viewMode, selectedMember, familyTotals, netWorth, memberIncomeThisMonth, memberFundedThisMonth, memberSpentThisMonth, memberCategoryBreakdown, memberOwnTransactions, categoryPie, monthlyTrend, yearlyTrend, dailyThisMonth, categorySpendThisMonth, onAddTx, onCategoryClick, onUpdateMember }) {
  const [trendView, setTrendView] = useState("monthly");
  const overallBudget = data.settings.overallBudget || 0;
  const overallRemaining = overallBudget - familyTotals.expense;
  const overallPct = overallBudget ? (familyTotals.expense / overallBudget) * 100 : 0;

  // ── Same category-budget / pie / trend cards as the family view, but scoped
  // to whichever person is selected, so individual view has full parity with family view.
  const isPersonView = viewMode !== "family" && !!selectedMember;

  const activeCategorySpend = (catId) => {
    if (!isPersonView) return categorySpendThisMonth(catId);
    return data.transactions
      .filter((t) => t.type === "expense" && t.categoryId === catId && t.memberId === selectedMember.id && monthKeyOf(t.date) === thisMonthKey())
      .reduce((s, t) => s + t.amount, 0);
  };

  const activeCategoryPie = isPersonView
    ? data.categories
        .map((c) => ({ id: c.id, name: c.name, color: c.color, value: activeCategorySpend(c.id) }))
        .filter((d) => d.value > 0)
    : categoryPie;

  const memberTxOnly = isPersonView ? data.transactions.filter((t) => t.memberId === selectedMember.id) : [];
  const activeMonthlyTrend = isPersonView
    ? buildTrendSeries(memberTxOnly, data.categories, (d) => monthKeyOf(d), (k) => monthLabel(k), (k) => monthLabel(k)).slice(-6)
    : monthlyTrend;
  const activeYearlyTrend = isPersonView
    ? buildTrendSeries(memberTxOnly, data.categories, (d) => (d || "").slice(0, 4), (k) => k, (k) => `Year ${k}`)
    : yearlyTrend;
  const activeDailyThisMonth = isPersonView
    ? buildTrendSeries(
        memberTxOnly.filter((t) => monthKeyOf(t.date) === thisMonthKey()),
        data.categories,
        (d) => d,
        (k) => new Date(k).toLocaleDateString("en-IN", { day: "numeric", month: "short" }),
        (k) => new Date(k).toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" })
      )
    : dailyThisMonth;

  // ── period selector (This month / Last month / This year / All time / Custom)
  const [period, setPeriod] = useState("month");
  const [custom, setCustom] = useState(() => ({ from: thisMonthKey() + "-01", to: todayISO() }));
  const [showAllCats, setShowAllCats] = useState(false);
  const ymd = (d) => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  const today = new Date();
  const range =
    period === "last" ? { from: ymd(new Date(today.getFullYear(), today.getMonth() - 1, 1)), to: ymd(new Date(today.getFullYear(), today.getMonth(), 0)) }
    : period === "year" ? { from: today.getFullYear() + "-01-01", to: ymd(today) }
    : period === "all" ? { from: "", to: "" }
    : period === "custom" ? custom
    : { from: thisMonthKey() + "-01", to: todayISO() };
  const inRange = data.transactions.filter((t) => (!range.from || t.date >= range.from) && (!range.to || t.date <= range.to));
  const sum = (arr, f) => arr.reduce((x, t) => x + f(t), 0);
  const fundShare = (t, id) => (t.paidFrom || []).filter((p) => p.memberId === id).reduce((x, p) => x + p.amount, 0);
  const sel = isPersonView ? selectedMember : null;
  const rangeIncome = sum(inRange.filter((t) => t.type === "income" && (!sel || t.memberId === sel.id)), (t) => t.amount);
  const rangeSpent = sum(inRange.filter((t) => t.type === "expense" && (!sel || t.memberId === sel.id)), (t) => t.amount);
  const rangeSaved = rangeIncome - rangeSpent;

  // ── balance = in hand + to receive − to pay
  const paidOnDebt = (id) => data.transactions.filter((t) => t.debtId === id).reduce((x, t) => x + t.amount, 0);
  const debtLeft = (d) => Math.max(0, d.totalAmount - paidOnDebt(d.id));
  const openDebts = data.debts.filter((d) => !isDebtSettled(d, data.transactions));
  const inHand = sel
    ? (data.places || []).filter((pl) => pl.ownerId === sel.id).reduce((x, pl) => x + (pl.balance || 0), 0)
    : sum(data.transactions.filter((t) => t.type === "income"), (t) => t.amount) - sum(data.transactions.filter((t) => t.type === "expense"), (t) => t.amount);
  const toReceive = sum(openDebts.filter((d) => (sel ? (d.direction === "owed_to_me" && d.memberId === sel.id && !d.internal) || (d.internal && d.toMember === sel.id) : d.direction === "owed_to_me" && !d.internal)), debtLeft);
  const toPay = sum(openDebts.filter((d) => (sel ? (d.direction === "i_owe" && d.memberId === sel.id && !d.internal) || (d.internal && d.fromMember === sel.id) : d.direction === "i_owe" && !d.internal)), debtLeft);
  const balance = inHand + toReceive - toPay;
  const heroColor = sel ? sel.color || "#1e3a5f" : null;

  // ── spending by category for the chosen period
  const catRows = data.categories
    .map((c) => ({ ...c, spent: sum(inRange.filter((t) => t.type === "expense" && t.categoryId === c.id && (!sel || t.memberId === sel.id)), (t) => t.amount) }))
    .filter((c) => c.spent > 0)
    .sort((x, y) => y.spent - x.spent);
  const catTotal = sum(catRows, (c) => c.spent);
  const shownCats = showAllCats ? catRows : catRows.slice(0, 5);
  const showBudgets = !sel && period === "month";

  // ── by person (family view only)
  const perPerson = data.members
    .map((m) => ({ m, income: sum(inRange.filter((t) => t.type === "income" && t.memberId === m.id), (t) => t.amount), spentFrom: sum(inRange.filter((t) => t.type === "expense" && t.memberId === m.id), (t) => t.amount) }))
    .filter((r) => r.income > 0 || r.spentFrom > 0);

  // ── latest entries
  const recent = data.transactions
    .filter((t) => !sel || t.memberId === sel.id)
    .slice()
    .sort((x, y) => y.date.localeCompare(x.date) || String(y.createdAt || "").localeCompare(String(x.createdAt || "")))
    .slice(0, 5);

  const hdr = "text-[15px] font-semibold tracking-tight text-indigo-950";

  return (
    <div className="space-y-4">
      {/* 1. one number first: total balance */}
      <Card className="p-5 border-none text-amber-50 bg-gradient-to-br from-indigo-950 to-indigo-900" style={sel ? { background: `linear-gradient(135deg, ${heroColor}, ${heroColor}cc)` } : undefined}>
        <div className="text-xs text-white/70 mb-1">{sel ? `${sel.name}'s balance` : "Family balance"}</div>
        <div className="font-mono text-3xl font-semibold tabular-nums">{fmt(balance)}</div>
        <div className="grid grid-cols-3 gap-2 mt-4 pt-3.5 border-t border-white/15">
          {[["In hand", inHand], ["To receive", toReceive], ["To pay", toPay]].map(([label, v]) => (
            <div key={label}>
              <div className="text-[11px] text-white/65">{label}</div>
              <div className="font-mono text-sm font-semibold tabular-nums">{fmt(v)}</div>
            </div>
          ))}
        </div>
        <p className="text-[11px] text-white/55 mt-3">Balance = money in hand + money to receive − money to pay</p>
      </Card>

      {/* 2. period switch */}
      <div className="flex gap-1.5 overflow-x-auto pb-0.5">
        {[["month", "This month"], ["last", "Last month"], ["year", "This year"], ["all", "All time"], ["custom", "Custom"]].map(([k, label]) => (
          <Pill key={k} active={period === k} onClick={() => setPeriod(k)}>{label}</Pill>
        ))}
      </div>
      {period === "custom" && (
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="block text-xs font-medium text-stone-500 mb-1 ml-0.5">From</label>
            <input type="date" className={inputCls} value={custom.from} onChange={(e) => setCustom({ ...custom, from: e.target.value })} />
          </div>
          <div>
            <label className="block text-xs font-medium text-stone-500 mb-1 ml-0.5">Till</label>
            <input type="date" className={inputCls} value={custom.to} onChange={(e) => setCustom({ ...custom, to: e.target.value })} />
          </div>
        </div>
      )}

      {/* 3. income / spent / saved */}
      <div className="grid grid-cols-3 gap-2.5">
        <div className="rounded-xl bg-emerald-50 p-3">
          <div className="text-xs font-medium text-emerald-700 mb-1">Income</div>
          <div className="font-mono text-base font-semibold text-emerald-700 tabular-nums">{fmt(rangeIncome)}</div>
        </div>
        <div className="rounded-xl bg-rose-50 p-3">
          <div className="text-xs font-medium text-rose-700 mb-1">Spent</div>
          <div className="font-mono text-base font-semibold text-rose-700 tabular-nums">{fmt(rangeSpent)}</div>
        </div>
        <div className="rounded-xl bg-stone-100 p-3">
          <div className="text-xs font-medium text-stone-600 mb-1">{rangeSaved < 0 ? "Overspent" : "Saved"}</div>
          <div className={`font-mono text-base font-semibold tabular-nums ${rangeSaved < 0 ? "text-rose-700" : "text-stone-800"}`}>{fmt(Math.abs(rangeSaved))}</div>
        </div>
      </div>

      {/* 4. budget */}
      {sel ? (
        <PersonDashboard part="budget" member={selectedMember} data={data} onUpdateMember={onUpdateMember} onCategoryClick={onCategoryClick} />
      ) : (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-2">
            <span className={hdr}>Monthly budget</span>
            <span className={`text-xs font-mono font-semibold ${overallRemaining < 0 ? "text-rose-600" : "text-stone-500"}`}>
              {overallRemaining < 0 ? `${fmt(Math.abs(overallRemaining))} over` : `${fmt(overallRemaining)} left`}
            </span>
          </div>
          <ProgressBar pct={overallPct} tone={overallPct >= 100 ? "over" : overallPct >= 80 ? "warn" : "ok"} />
          <div className="text-xs text-stone-500 mt-1.5">{fmt(familyTotals.expense)} of {fmt(overallBudget)} spent this month</div>
        </Card>
      )}

      {/* 5. who earned / spent (family only) */}
      {!sel && perPerson.length > 1 && (
        <Card className="p-4">
          <h3 className={hdr + " mb-3"}>By person</h3>
          <div className="space-y-2.5">
            {perPerson.map(({ m, income, spentFrom }) => (
              <div key={m.id} className="flex items-center gap-3">
                <Avatar member={m} size="sm" />
                <span className="text-sm font-medium flex-1 min-w-0 truncate">{m.name}</span>
                <span className="text-xs font-mono text-emerald-700 tabular-nums">{income ? "+" + fmt(income) : "—"}</span>
                <span className="w-20 text-right text-xs font-mono text-rose-700 tabular-nums">{spentFrom ? "−" + fmt(spentFrom) : "—"}</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* 6. spending by category: one card (chart + list) */}
      <Card className="p-4">
        <div className="flex items-baseline justify-between mb-2">
          <h3 className={hdr}>Spending by category</h3>
          <span className="text-xs font-mono text-stone-500">{fmt(catTotal)}</span>
        </div>
        {catRows.length === 0 ? (
          <p className="text-sm text-stone-500 py-6 text-center">No spending in this period.</p>
        ) : (
          <>
            <div className="h-44">
              <ResponsiveContainer width="100%" height="100%">
                <PieChart>
                  <Pie data={catRows} dataKey="spent" nameKey="name" innerRadius={48} outerRadius={78} paddingAngle={2} onClick={(entry) => onCategoryClick(entry.id)}>
                    {catRows.map((c) => <Cell key={c.id} fill={c.color} />)}
                  </Pie>
                  <Tooltip formatter={(v) => fmt(v)} />
                </PieChart>
              </ResponsiveContainer>
            </div>
            <div className="space-y-3 mt-2">
              {shownCats.map((c) => {
                const share = catTotal ? (c.spent / catTotal) * 100 : 0;
                const bPct = c.budgetLimit ? (c.spent / c.budgetLimit) * 100 : 0;
                const useBudget = showBudgets && c.budgetLimit > 0;
                return (
                  <button key={c.id} type="button" onClick={() => onCategoryClick(c.id)} className="w-full text-left">
                    <div className="flex items-center gap-2.5">
                      <IconBadge iconName={c.icon} color={c.color} size="sm" />
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-2">
                          <span className="text-sm font-medium truncate">{c.name}</span>
                          <span className="text-sm font-mono font-semibold tabular-nums">{fmt(c.spent)}</span>
                        </div>
                        {useBudget ? (
                          <>
                            <ProgressBar pct={bPct} tone={bPct >= 100 ? "over" : bPct >= 80 ? "warn" : "ok"} />
                            <div className="text-xs text-stone-500 mt-0.5">of {fmt(c.budgetLimit)} budget</div>
                          </>
                        ) : (
                          <div className="flex items-center gap-2 mt-1">
                            <div className="flex-1 h-1.5 rounded-full bg-stone-100 overflow-hidden"><div className="h-full rounded-full" style={{ width: share + "%", backgroundColor: c.color }} /></div>
                            <span className="text-xs text-stone-500 w-9 text-right">{Math.round(share)}%</span>
                          </div>
                        )}
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>
            {catRows.length > 5 && (
              <button type="button" onClick={() => setShowAllCats((v) => !v)} className="w-full mt-3 text-xs font-semibold text-indigo-950 py-2 rounded-lg bg-stone-100">
                {showAllCats ? "Show less" : `Show all ${catRows.length} categories`}
              </button>
            )}
          </>
        )}
      </Card>

      {/* 7. trend */}
      {activeMonthlyTrend.length > 0 && (() => {
        const trendData = trendView === "yearly" ? activeYearlyTrend : trendView === "daily" ? activeDailyThisMonth : activeMonthlyTrend;
        const trendTitle = (isPersonView ? `${selectedMember.name}'s ` : "") + (trendView === "yearly" ? "Yearly trend" : trendView === "daily" ? `Daily — ${monthLabel(thisMonthKey())}` : "Monthly trend");
        const isDaily = trendView === "daily";
        return (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-2 gap-2 flex-wrap">
            <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950">{trendTitle}</h3>
            <div className="flex gap-1.5">
              <Pill active={trendView === "monthly"} onClick={() => setTrendView("monthly")}>Monthly</Pill>
              <Pill active={trendView === "yearly"} onClick={() => setTrendView("yearly")}>Yearly</Pill>
              <Pill active={trendView === "daily"} onClick={() => setTrendView("daily")}>This month</Pill>
            </div>
          </div>
          {trendData.length > 0 ? (
            <div className="h-60">
              <ResponsiveContainer width="100%" height="100%">
                <BarChart data={trendData} margin={{ top: 4, right: 4, left: 0, bottom: 0 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke="#e7e5e4" vertical={false} />
                  <XAxis
                    dataKey="label"
                    tick={{ fontSize: isDaily ? 10 : 11, fill: "#78716c" }}
                    axisLine={false}
                    tickLine={false}
                    interval={isDaily ? "preserveStartEnd" : 0}
                    angle={isDaily ? -30 : 0}
                    textAnchor={isDaily ? "end" : "middle"}
                    height={isDaily ? 46 : 20}
                  />
                  <YAxis tick={{ fontSize: 10, fill: "#78716c" }} axisLine={false} tickLine={false} width={40} />
                  <Tooltip content={<TrendTooltip />} cursor={{ fill: "rgba(30,58,95,0.05)" }} />
                  <Bar dataKey="income" fill="#059669" radius={[4, 4, 0, 0]} />
                  <Bar dataKey="expense" fill="#e11d48" radius={[4, 4, 0, 0]} />
                </BarChart>
              </ResponsiveContainer>
            </div>
          ) : (
            <p className="text-sm text-stone-400 py-10 text-center">
              {isDaily ? `No transactions yet for ${monthLabel(thisMonthKey())}.` : "No transactions yet."}
            </p>
          )}
          <div className="flex items-center justify-center gap-4 mt-1 text-[11px] text-stone-500">
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-emerald-600" /> Income</span>
            <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-rose-600" /> Expense</span>
            <span className="text-stone-400">Tap/hover a bar for details</span>
          </div>
        </Card>
        );
      })()}

      {/* 8. latest entries */}
      <Card className="p-4">
        <div className="flex items-center justify-between mb-3">
          <h3 className={hdr}>Recent activity</h3>
          <button type="button" onClick={onViewAll} className="text-xs font-semibold text-amber-700">See all</button>
        </div>
        {recent.length === 0 ? (
          <p className="text-sm text-stone-500 py-2">No entries yet.</p>
        ) : (
          <div className="space-y-3">
            {recent.map((t) => {
              const cat = data.categories.find((c) => c.id === t.categoryId);
              const mem = data.members.find((m) => m.id === t.memberId);
              const inc = t.type === "income";
              return (
                <div key={t.id} className="flex items-center gap-2.5">
                  {cat ? <IconBadge iconName={cat.icon} color={cat.color} size="sm" /> : <div className="w-8 h-8 rounded-xl bg-emerald-50 text-emerald-700 flex items-center justify-center"><ArrowUpRight size={14} /></div>}
                  <div className="flex-1 min-w-0">
                    <div className="text-sm font-medium truncate">{t.note || cat?.name || (inc ? "Income" : "Expense")}</div>
                    <div className="text-xs text-stone-500">{shortDate(t.date)}{mem ? " · " + mem.name : ""}</div>
                  </div>
                  <span className={`font-mono text-sm font-semibold tabular-nums ${inc ? "text-emerald-700" : "text-rose-700"}`}>{inc ? "+" : "−"}{fmt(t.amount)}</span>
                </div>
              );
            })}
          </div>
        )}
      </Card>

      {/* 9. person-only extras: accounts, allowances, debts, recurring */}
      {sel && <PersonDashboard part="rest" member={selectedMember} data={data} onUpdateMember={onUpdateMember} onCategoryClick={onCategoryClick} />}
    </div>
  );
}

function PersonDashboard({ member, data, onUpdateMember, onCategoryClick, part = "all" }) {
  const cardColor = member.color || "#1e3a5f";
  const paidOnDebt = (id) => data.transactions.filter((t) => t.debtId === id).reduce((s, t) => s + t.amount, 0);
  const monthTx = data.transactions.filter((t) => monthKeyOf(t.date) === thisMonthKey());
  const incomeThisMonth = monthTx
    .filter((t) => t.type === "income" && t.memberId === member.id)
    .reduce((s, t) => s + t.amount, 0);
  // money that left this person's own pocket this month (their share of expenses)
  const spentThisMonth = monthTx
    .filter((t) => t.type === "expense" && t.memberId === member.id)
    .reduce((s, t) => s + t.amount, 0);

  // ── traceable, date-range summary (mirrors the Family summary card) ──
  const [range, setRange] = useState(() => ({ from: thisMonthKey() + "-01", to: todayISO() }));
  const inRangeTx = data.transactions.filter(
    (t) => (!range.from || t.date >= range.from) && (!range.to || t.date <= range.to)
  );
  const rangeIncome = inRangeTx
    .filter((t) => t.type === "income" && t.memberId === member.id)
    .reduce((s, t) => s + t.amount, 0);
  const rangeSpent = inRangeTx
    .filter((t) => t.type === "expense")
    .reduce((s, t) => s + (t.paidFrom || []).filter((p) => p.memberId === member.id).reduce((x, p) => x + p.amount, 0), 0);
  const rangeNet = rangeIncome - rangeSpent;

  // this person's own sources
  const sources = (data.places || []).filter((p) => p.ownerId === member.id);
  const sourcesTotal = sources.reduce((s, p) => s + (p.balance || 0), 0);
  const myAllowances = (data.allowances || []).filter((a) => a.memberId === member.id);

  // this person's debts (assigned to them) + family IOUs involving them
  const owedToThem = data.debts.filter(
    (d) => !isDebtSettled(d, data.transactions) &&
      ((d.direction === "owed_to_me" && d.memberId === member.id && !d.internal) || (d.internal && d.toMember === member.id))
  );
  const theyOwe = data.debts.filter(
    (d) => !isDebtSettled(d, data.transactions) &&
      ((d.direction === "i_owe" && d.memberId === member.id && !d.internal) || (d.internal && d.fromMember === member.id))
  );
  const owedAmt = owedToThem.reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
  const oweAmt = theyOwe.reduce((s, d) => s + Math.max(0, d.totalAmount - paidOnDebt(d.id)), 0);
  const netWorth = sourcesTotal + owedAmt - oweAmt;

  const budget = member.budget || 0;
  const budgetPct = budget ? (spentThisMonth / budget) * 100 : 0;
  const budgetRemaining = budget - spentThisMonth;

  const recentTx = data.transactions
    .filter((t) => t.type === "expense" && t.memberId === member.id)
    .sort((a, b) => b.date.localeCompare(a.date))
    .slice(0, 6);
  const recurringMine = (data.recurring || []).filter((r) => r.memberId === member.id);

  const [budgetInput, setBudgetInput] = useState(String(budget || ""));

  return (
    <div className="space-y-5">
      {part !== "rest" && (
        <>
      {/* personal monthly budget */}
      <Card className="p-4">
        <div className="flex items-center justify-between mb-1.5">
          <span className="text-sm font-semibold text-stone-600">My monthly budget</span>
          <div className="flex items-center gap-1">
            <span className="text-xs text-stone-400">₹</span>
            <input
              type="number" step="any" inputMode="decimal"
              className="w-24 px-2 py-1 rounded-lg border border-stone-300 text-sm text-right"
              value={budgetInput}
              onChange={(e) => setBudgetInput(e.target.value)}
              onBlur={() => onUpdateMember(member.id, { budget: Number(budgetInput) || 0 })}
            />
          </div>
        </div>
        {budget > 0 ? (
          <>
            <ProgressBar pct={budgetPct} tone={budgetPct >= 100 ? "over" : budgetPct >= 80 ? "warn" : "ok"} />
            <div className="flex items-center justify-between mt-1.5">
              <span className="text-[11px] text-stone-400">{fmt(spentThisMonth)} of {fmt(budget)} spent</span>
              <span className={`text-[11px] font-mono font-semibold ${budgetRemaining < 0 ? "text-rose-600" : "text-stone-500"}`}>
                {budgetRemaining < 0 ? `${fmt(Math.abs(budgetRemaining))} over` : `${fmt(budgetRemaining)} left`}
              </span>
            </div>
          </>
        ) : (
          <p className="text-[11px] text-stone-400">Set a monthly budget above to track it.</p>
        )}
      </Card>

        </>
      )}

      {part !== "budget" && (
        <>
      {/* my sources */}
      <Card className="p-4">
        <div className="flex items-center justify-between mb-2">
          <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950">My sources</h3>
          <span className="font-mono text-sm font-semibold text-stone-600 tabular-nums">{fmt(sourcesTotal)}</span>
        </div>
        <div className="space-y-2">
          {sources.map((p) => (
            <div key={p.id} className="flex items-center gap-2.5">
              <IconBadge iconName={p.icon} color={p.color} size="sm" />
              <span className="text-sm flex-1 min-w-0 truncate">{p.name}</span>
              <span className={`font-mono text-sm tabular-nums ${p.balance < 0 ? "text-rose-600" : "text-stone-500"}`}>{fmt(p.balance)}</span>
            </div>
          ))}
          {sources.length === 0 && <p className="text-xs text-stone-400">No sources yet. Add one in the Places tab and set "Belongs to" this person.</p>}
        </div>
      </Card>

      {/* my ghar kharcha allowance */}
      {myAllowances.length > 0 && (
        <Card className="p-4">
          <div className="flex items-center justify-between mb-2">
            <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950 flex items-center gap-1.5"><HandCoins size={15} /> My Ghar Kharcha</h3>
          </div>
          <div className="space-y-2">
            {myAllowances.map((a) => (
              <div key={a.id} className="flex items-center justify-between">
                <span className="text-sm flex-1 min-w-0 truncate">{a.note || "Household allowance"}</span>
                <span className={`font-mono text-sm tabular-nums ${a.balance < 0 ? "text-rose-600" : "text-stone-500"}`}>{fmt(a.balance)} left</span>
              </div>
            ))}
          </div>
        </Card>
      )}

      {/* my debts */}
      {(owedToThem.length > 0 || theyOwe.length > 0) && (
        <Card className="p-4">
          <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950 mb-2">My debts</h3>
          {owedToThem.length > 0 && (
            <div className="mb-2">
              <div className="text-[11px] uppercase tracking-wide text-emerald-700 mb-1">Owed to {member.name}</div>
              {owedToThem.map((d) => (
                <div key={d.id} className="flex items-center justify-between text-sm py-0.5">
                  <span className="truncate">{d.personName}</span>
                  <span className="font-mono text-emerald-700 tabular-nums">{fmt(Math.max(0, d.totalAmount - paidOnDebt(d.id)))}</span>
                </div>
              ))}
            </div>
          )}
          {theyOwe.length > 0 && (
            <div>
              <div className="text-[11px] uppercase tracking-wide text-rose-700 mb-1">{member.name} owes</div>
              {theyOwe.map((d) => (
                <div key={d.id} className="flex items-center justify-between text-sm py-0.5">
                  <span className="truncate">{d.personName}</span>
                  <span className="font-mono text-rose-700 tabular-nums">{fmt(Math.max(0, d.totalAmount - paidOnDebt(d.id)))}</span>
                </div>
              ))}
            </div>
          )}
        </Card>
      )}

      {/* my recurring */}
      {recurringMine.length > 0 && (
        <Card className="p-4">
          <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950 mb-2">My recurring</h3>
          <div className="space-y-1.5">
            {recurringMine.map((r) => (
              <div key={r.id} className="flex items-center justify-between text-sm">
                <span className="truncate">{r.note || (r.type === "income" ? "Income" : "Expense")} · day {r.dayOfMonth}</span>
                <span className={`font-mono tabular-nums ${r.type === "income" ? "text-emerald-700" : "text-rose-700"}`}>
                  {r.type === "income" ? "+" : "−"}{fmt(r.amount)}
                </span>
              </div>
            ))}
          </div>
        </Card>
      )}

        </>
      )}
    </div>
  );
}

function ShareAccessCard({ owner, allMembers, onToggle }) {
  const others = allMembers.filter((m) => m.id !== owner.id);
  const shared = owner.sharedWith || [];
  return (
    <Card className="p-4">
      <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950 mb-1">Share my spending with</h3>
      <p className="text-xs text-stone-400 mb-3">{useLang().t("onlyTheseSee")}</p>
      <div className="flex flex-wrap gap-2">
        {others.map((m) => {
          const active = shared.includes(m.id);
          return (
            <button
              key={m.id}
              onClick={() => onToggle(owner.id, m.id)}
              className={`flex items-center gap-1.5 pl-1 pr-3 py-1 rounded-full border text-xs font-medium transition-colors ${
                active ? "bg-emerald-600 text-white border-emerald-600" : "bg-stone-100 text-stone-500 border-stone-200"
              }`}
            >
              <Avatar member={m} size="sm" />
              {m.name}
              {active && <Check size={12} />}
            </button>
          );
        })}
        {others.length === 0 && <p className="text-xs text-stone-500">There are no other members to choose from.</p>}
      </div>
    </Card>
  );
}

/* ---------------------------------- Transactions ---------------------------------- */

function TransactionsTab({ data, mode = "expense", filters, setFilters, filteredTx, incomeMembers, onDelete, onEdit, onAdd }) {
  const isIncome = mode === "income";
  const baseOptions = isIncome ? (incomeMembers || []) : data.members;
  const memberOptions = filters.member !== "all" && !baseOptions.some((m) => m.id === filters.member)
    ? [...baseOptions, ...data.members.filter((m) => m.id === filters.member)]
    : baseOptions;
  const hasFilters = !!(filters.q || filters.category !== "all" || filters.from || filters.to);
  return (
    <div className="space-y-4">
      <Card className="p-3.5 space-y-2.5">
        <div className="relative">
          <Search size={15} className="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400" />
          <input
            className={`${inputCls} pl-9`}
            placeholder={isIncome ? "Search income — e.g. salary, Ramesh, 50000…" : "Search anything — e.g. electricity, Ramesh, rent, 5000…"}
            value={filters.q}
            onChange={(e) => setFilters({ ...filters, q: e.target.value })}
          />
        </div>
        <div className={isIncome ? "" : "grid grid-cols-2 gap-2"}>
          {!isIncome && (
            <select className={inputCls} value={filters.category} onChange={(e) => setFilters({ ...filters, category: e.target.value })}>
              <option value="all">All categories</option>
              {data.categories.map((c) => (
                <option key={c.id} value={c.id}>{c.name}</option>
              ))}
            </select>
          )}
          <select className={inputCls} value={filters.member} onChange={(e) => setFilters({ ...filters, member: e.target.value })}>
            <option value="all">{isIncome ? "All sources" : "All members"}</option>
            {memberOptions.map((m) => (
              <option key={m.id} value={m.id}>{m.name}</option>
            ))}
          </select>
        </div>
        <div className="grid grid-cols-2 gap-2">
          <div>
            <label className="block text-[11px] font-medium text-stone-500 mb-1 ml-0.5">From</label>
            <input type="date" className={inputCls} value={filters.from} onChange={(e) => setFilters({ ...filters, from: e.target.value })} />
          </div>
          <div>
            <label className="block text-[11px] font-medium text-stone-500 mb-1 ml-0.5">Till</label>
            <input type="date" className={inputCls} value={filters.to} onChange={(e) => setFilters({ ...filters, to: e.target.value })} />
          </div>
        </div>
      </Card>

      {filteredTx.length > 0 && (
        <div className="flex items-center justify-between px-1">
          <span className="text-sm text-stone-500">{filteredTx.length} {filteredTx.length === 1 ? "entry" : "entries"}</span>
          <span className={`font-mono text-sm font-semibold tabular-nums ${isIncome ? "text-emerald-700" : "text-rose-700"}`}>{isIncome ? "+" : "−"}{fmt(filteredTx.reduce((x, t) => x + t.amount, 0))}</span>
        </div>
      )}

      <div className="space-y-2">
        {(() => {
          const groups = [];
          filteredTx.forEach((t) => { const g = groups[groups.length - 1]; if (g && g.date === t.date) g.items.push(t); else groups.push({ date: t.date, items: [t] }); });
          const yest = (() => { const d = new Date(); d.setDate(d.getDate() - 1); return localISO(d); })();
          return groups.map((g) => (
            <div key={g.date} className="space-y-2">
              <div className="flex items-center justify-between px-1 pt-2">
                <span className="text-xs font-semibold uppercase tracking-wide text-stone-500">{g.date === todayISO() ? "Today" : g.date === yest ? "Yesterday" : shortDate(g.date)}</span>
                <span className="text-xs font-mono text-stone-500 tabular-nums">{isIncome ? "+" : "−"}{fmt(g.items.reduce((x, t) => x + t.amount, 0))}</span>
              </div>
              {g.items.map((t) => {
                const cat = data.categories.find((c) => c.id === t.categoryId);
                const mem = data.members.find((m) => m.id === t.memberId);
                const place = t.placeId ? (data.places || []).find((pl) => pl.id === t.placeId) : null;
                return (
                  <Card key={t.id} className="p-3.5 flex items-center gap-3">
                    {cat ? <IconBadge iconName={cat.icon} color={cat.color} /> : <div className="w-10 h-10 rounded-xl bg-emerald-50 flex items-center justify-center text-emerald-700 shrink-0"><ArrowUpRight size={18} /></div>}
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center justify-between gap-2">
                        <span className="text-[15px] font-medium truncate">{t.note || (t.type === "income" ? "Income" : cat?.name)}</span>
                        <span className={`font-mono text-sm font-semibold tabular-nums shrink-0 ${t.type === "income" ? "text-emerald-700" : "text-rose-700"}`}>{t.type === "income" ? "+" : "−"}{fmt(t.amount)}</span>
                      </div>
                      <div className="text-xs text-stone-500 truncate mt-0.5">
                        {[t.note && cat ? cat.name : null, mem?.name, place?.name].filter(Boolean).join(" · ") || "—"}
                      </div>
                      {t.updatedAt && (
                        <div className="text-[11px] text-stone-400 mt-0.5">{t.updatedAt !== t.createdAt ? "Last modified" : "Added"} {fmtStamp(t.updatedAt)}</div>
                      )}
                    </div>
                    <button onClick={() => onEdit(t)} className="text-stone-300 hover:text-indigo-700 p-1" title="Edit / correct"><Pencil size={15} /></button>
                    <button onClick={() => onDelete(t.id)} className="text-stone-300 hover:text-rose-600 p-1" title="Delete"><Trash2 size={15} /></button>
                  </Card>
                );
              })}
            </div>
          ));
        })()}
        {filteredTx.length === 0 && (
          <EmptyState
            title={isIncome ? "No income entries found" : "No transactions found"}
            text={hasFilters ? "Nothing matches your current search or filters. Try changing them, or clear the filters." : isIncome ? "Income you add will appear here." : "Expenses you add will appear here."}
            actionLabel={hasFilters ? "Clear filters" : isIncome ? "Add income" : "Add expense"}
            onAction={() => (hasFilters ? setFilters({ ...filters, q: "", category: "all", from: "", to: "" }) : onAdd(isIncome ? "income" : "expense"))}
          />
        )}
      </div>
    </div>
  );
}

/* ---------------------------------- Places ---------------------------------- */

function PlacesTab({ data, viewMode, selectedMember, onAddPlace, onUpdatePlace, onDeletePlace, onAdjustPlace }) {
  const [showNew, setShowNew] = useState(false);
  const [adjusting, setAdjusting] = useState(null);
  const [editingId, setEditingId] = useState(null);
  const isPersonView = viewMode !== "family" && !!selectedMember;
  // In a person's view: show their own places plus any shared (no-owner) family places.
  // Other people's individually-owned places are hidden to keep this scoped to them.
  const places = (data.places || []).filter(
    (p) => !isPersonView || !p.ownerId || p.ownerId === selectedMember.id
  );
  const total = places.reduce((s, p) => s + (p.balance || 0), 0);
  const adjustingPlace = places.find((p) => p.id === adjusting);
  const editingPlace = places.find((p) => p.id === editingId);

  return (
    <div className="space-y-4">
      <Card className="p-5 bg-gradient-to-br from-indigo-950 to-indigo-900 text-amber-50 border-none">
        <div className="flex items-center gap-2 text-indigo-300 text-xs uppercase tracking-wide mb-1">
          <Wallet size={13} /> {isPersonView ? `${selectedMember.name}'s total` : "Total across places"}
        </div>
        <div className="font-mono text-3xl font-semibold tabular-nums">{fmt(total)}</div>
        <p className="text-xs text-indigo-300 mt-1">{useLang().t("moneyEverywhere")}</p>
      </Card>

      <div className="flex items-center justify-between">
        <h3 className="text-[15px] font-semibold tracking-tight text-indigo-950">{isPersonView ? `${selectedMember.name}'s places` : "Your places"}</h3>
        <button onClick={() => setShowNew(true)} className="text-xs font-semibold text-indigo-950 bg-amber-400 px-3 py-1.5 rounded-full flex items-center gap-1">
          <Plus size={13} /> Place
        </button>
      </div>

      <div className="space-y-2">
        {places.map((p) => (
          <Card key={p.id} className="p-3.5">
            <div className="flex items-center gap-3">
              <IconBadge iconName={p.icon} color={p.color} size="sm" />
              <div className="flex-1 min-w-0">
                <div className="text-sm font-medium truncate flex items-center gap-1.5">
                  {p.name}
                  {p.ownerId
                    ? <span className="text-[9px] uppercase tracking-wide bg-stone-100 text-stone-500 px-1.5 py-0.5 rounded-full">{data.members.find((m) => m.id === p.ownerId)?.name || "?"}</span>
                    : <span className="text-[9px] uppercase tracking-wide bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded-full">shared</span>}
                </div>
                <div className={`font-mono text-sm tabular-nums ${p.balance < 0 ? "text-rose-600" : "text-stone-500"}`}>
                  {fmt(p.balance)}
                </div>
              </div>
              <button
                onClick={() => setAdjusting(p.id)}
                className="text-xs font-semibold text-indigo-950 bg-stone-100 px-2.5 py-1.5 rounded-lg shrink-0"
              >
                Adjust
              </button>
              <button
                onClick={() => setEditingId(p.id)}
                className="text-stone-400 hover:text-indigo-950 p-1 shrink-0"
                title="Edit"
              >
                <Pencil size={14} />
              </button>
              <button onClick={() => onDeletePlace(p.id)} className="text-stone-300 hover:text-rose-600 p-1 shrink-0">
                <Trash2 size={14} />
              </button>
            </div>
          </Card>
        ))}
        {places.length === 0 && (
          <EmptyState icon={Wallet} title="No places added yet" text="Add a bank account, cash wallet or investment to track where your money is kept." />
        )}
      </div>

      {showNew && (
        <Modal title="New place" onClose={() => setShowNew(false)}>
          <NewPlaceForm members={data.members} onSave={(p) => { onAddPlace(p); setShowNew(false); }} />
        </Modal>
      )}

      {editingPlace && (
        <Modal title={`Edit — ${editingPlace.name}`} onClose={() => setEditingId(null)}>
          <NewPlaceForm
            members={data.members}
            editing={editingPlace}
            onSave={(patch) => { onUpdatePlace(editingId, patch); setEditingId(null); }}
          />
        </Modal>
      )}

      {adjustingPlace && (
        <Modal title={`Adjust — ${adjustingPlace.name}`} onClose={() => setAdjusting(null)}>
          <AdjustPlaceForm
            currentBalance={adjustingPlace.balance}
            onSave={(delta) => { onAdjustPlace(adjusting, delta); setAdjusting(null); }}
          />
        </Modal>
      )}
    </div>
